    routePanel.dataset.pinnedActivityIndex = activityIndex != null && activityIndex !== '' ? String(activityIndex) : '';
    applyRouteActivityHighlight(routePanel, activityIndex);
  }

  function restoreRouteActivityHighlight(routePanel) {
    const current = routePanel.dataset.pinnedActivityIndex;
    if (current) {
      applyRouteActivityHighlight(routePanel, Number(current));
      return;
    }
    if (routePanel.dataset.activeType === 'stop' && routePanel.dataset.activeIndex !== '') {
      const activityIndex = getRouteStopActivityIndex(routePanel, Number(routePanel.dataset.activeIndex));
      applyRouteActivityHighlight(routePanel, activityIndex);
      return;
    }
    if (routePanel.dataset.activeType === 'segment' && routePanel.dataset.activeIndex !== '') {
      const activityIndex = getRouteSegmentActivityIndex(routePanel, Number(routePanel.dataset.activeIndex));
      applyRouteActivityHighlight(routePanel, activityIndex);
      return;
    }
    applyRouteActivityHighlight(routePanel, null);
  }

  function focusRouteTimelineActivity(routePanel, activityIndex) {
    const scrollWrap = routePanel.querySelector('.route-timeline-scroll');
    const target = routePanel.querySelector(`.route-timeline-segment[data-activity-index="${activityIndex}"]`);
    if (!scrollWrap || !target) return;
    const stage = routePanel.querySelector('.route-timeline-stage');
    const svg = routePanel.querySelector('.route-timeline-svg');
    const centerX = Number(target.dataset.centerX || 0);
    const viewBoxWidth = svg?.viewBox?.baseVal?.width || 0;
    const renderedWidth = svg?.getBoundingClientRect().width || 0;
    const stageStyle = stage ? getComputedStyle(stage) : null;
    const stagePadLeft = stageStyle ? parseFloat(stageStyle.paddingLeft) || 0 : 0;
    let targetCenter = 0;
    if (centerX > 0 && viewBoxWidth > 0 && renderedWidth > 0) {
      targetCenter = stagePadLeft + centerX * (renderedWidth / viewBoxWidth);
    } else {
      const wrapRect = scrollWrap.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      targetCenter = scrollWrap.scrollLeft + (targetRect.left - wrapRect.left) + targetRect.width / 2;
    }
    scrollWrap.scrollTo({
      left: Math.max(0, targetCenter - scrollWrap.clientWidth / 2),
      behavior: 'auto'
    });
    updateRouteTimelineMask(scrollWrap);
  }

  function captureRoutePanelUiState(routePanel) {
    if (!routePanel) return null;
    return {
      activeType: routePanel.dataset.activeType || '',
      activeIndex: routePanel.dataset.activeIndex || '',
      pinnedActivityIndex: routePanel.dataset.pinnedActivityIndex || '',
      activeActivityIndex: routePanel.dataset.activeActivityIndex || '',
      suppressClickUntil: routePanel.dataset.suppressClickUntil || '',
      timelineScrollLeft: routePanel.querySelector('.route-timeline-scroll')?.scrollLeft || 0,
      segmentStripScrollLeft: routePanel.querySelector('.route-segment-strip')?.scrollLeft || 0,
      stopStripScrollLeft: routePanel.querySelector('.route-stop-strip')?.scrollLeft || 0
    };
  }

  function buildRouteSelectionFromUiState(routePanel, state) {
    if (!routePanel || !state?.activeType || state.activeIndex === '') return null;
    const activeIndex = Number(state.activeIndex);
    if (Number.isNaN(activeIndex)) return null;
    if (state.activeType === 'segment') {
      const segmentEl = routePanel.querySelector(`.route-segment-card[data-segment-index="${activeIndex}"], .route-svg-segment[data-segment-index="${activeIndex}"]`);
      const stopIndices = String(segmentEl?.dataset?.stopIndices || '')
        .split(',')
        .map(value => Number(value))
        .filter(value => !Number.isNaN(value));
      return getRouteSelectionForSegment(activeIndex, stopIndices);
    }
    if (state.activeType === 'stop') {
      const totalStops = routePanel.querySelectorAll('.route-stop-pill').length;
      return getRouteSelectionForStop(activeIndex, totalStops);
    }
    return null;
  }

  function restoreRoutePanelUiState(routePanel, state) {
    if (!routePanel || !state) return;
    const selection = buildRouteSelectionFromUiState(routePanel, state);
    if (selection) applyRouteSelection(routePanel, selection);
    else applyRouteSelection(routePanel, null);
    if (state.pinnedActivityIndex !== '') {
      setPinnedRouteActivityHighlight(routePanel, Number(state.pinnedActivityIndex));
    } else if (state.activeActivityIndex !== '') {
      applyRouteActivityHighlight(routePanel, Number(state.activeActivityIndex));
    } else {
      restoreRouteActivityHighlight(routePanel);
    }
    if (state.suppressClickUntil) routePanel.dataset.suppressClickUntil = state.suppressClickUntil;
    const timelineScroll = routePanel.querySelector('.route-timeline-scroll');
    if (timelineScroll) {
      timelineScroll.scrollLeft = state.timelineScrollLeft || 0;
      updateRouteTimelineMask(timelineScroll);
    }
    const segmentStrip = routePanel.querySelector('.route-segment-strip');
    if (segmentStrip) segmentStrip.scrollLeft = state.segmentStripScrollLeft || 0;
    const stopStrip = routePanel.querySelector('.route-stop-strip');
    if (stopStrip) stopStrip.scrollLeft = state.stopStripScrollLeft || 0;
  }

  function getRouteTimelineMinutesFromClientX(svg, clientX) {
    const rect = svg.getBoundingClientRect();
    const ratio = rect.width / (svg.viewBox.baseVal.width || 520);
    const leftPadPx = 18 * ratio;
    const rightPadPx = 18 * ratio;
    const usableWidth = Math.max(1, rect.width - leftPadPx - rightPadPx);
    const rawX = clientX - rect.left - leftPadPx;
    const clampedRatio = Math.max(0, Math.min(1, rawX / usableWidth));
    return clampTime(Math.round(clampedRatio * 24 * 60));
  }

  function snapMinutesToQuarter(minutes) {
    return clampTime(Math.round(minutes / 15) * 15);
  }

  function getSoftSnappedTimelineMinutes(minutes) {
    const quarter = snapMinutesToQuarter(minutes);
    if (Math.abs(quarter - minutes) <= 5) return quarter;
    return clampTime(Math.round(minutes / 5) * 5);
  }

  function updateRouteTimelineSegmentPreview(segmentEl, startMin, endMin) {
    const svg = segmentEl.closest('.route-timeline-svg');
    if (!svg) return;
    const viewBoxWidth = svg.viewBox.baseVal.width || 520;
    const leftPad = 18;
    const rightPad = 18;
    const usableWidth = viewBoxWidth - leftPad - rightPad;
    const line = segmentEl.querySelector('.route-timeline-line');
    const start = segmentEl.querySelector('.route-timeline-endpoint.start');
    const end = segmentEl.querySelector('.route-timeline-endpoint.end');
    const connector = segmentEl.querySelector('.route-timeline-connector');
    const badge = segmentEl.querySelector('.route-timeline-badge');
    const pinBadge = segmentEl.querySelector('.route-timeline-pin-badge');
    if (!line || !start || !end || !badge) return;
    const x1 = leftPad + (usableWidth * startMin) / (24 * 60);
    const x2 = leftPad + (usableWidth * endMin) / (24 * 60);
    const safeX2 = Math.max(x2, x1 + 10);
    const y = Number(line.getAttribute('y1'));
    line.setAttribute('x1', String(x1));
    line.setAttribute('x2', String(safeX2));
    start.setAttribute('cx', String(x1));
    end.setAttribute('cx', String(safeX2));
    if (connector) connector.setAttribute('transform', `translate(${x1}, ${y})`);
    badge.setAttribute('transform', `translate(${(x1 + safeX2) / 2}, ${y + 16})`);
    if (pinBadge) pinBadge.setAttribute('transform', `translate(${safeX2 + 12}, ${y - 14})`);
  }

  function ensureRouteTimelineTooltip(routePanel) {
    let tooltip = routePanel.querySelector('.route-timeline-tooltip');
    if (tooltip) return tooltip;
    tooltip = document.createElement('div');
    tooltip.className = 'route-timeline-tooltip';
    routePanel.appendChild(tooltip);
    return tooltip;
  }

  function showRouteTimelineTooltip(routePanel, clientX, clientY, label) {
    const tooltip = ensureRouteTimelineTooltip(routePanel);
    const panelRect = routePanel.getBoundingClientRect();
    tooltip.textContent = label;
    tooltip.classList.add('visible');
    tooltip.style.transform = `translate(${clientX - panelRect.left + 10}px, ${clientY - panelRect.top - 30}px)`;
  }

  function hideRouteTimelineTooltip(routePanel) {
    const tooltip = routePanel.querySelector('.route-timeline-tooltip');
    if (!tooltip) return;
    tooltip.classList.remove('visible');
    tooltip.style.transform = 'translate(-9999px, -9999px)';
  }

  function updateRouteTimelineMask(scrollWrap) {
    const maxScrollLeft = Math.max(0, scrollWrap.scrollWidth - scrollWrap.clientWidth);
    scrollWrap.classList.toggle('has-left-mask', scrollWrap.scrollLeft > 4);
    scrollWrap.classList.toggle('has-right-mask', scrollWrap.scrollLeft < maxScrollLeft - 4);
  }

  function updateRouteTimelineEdgePadding(routePanel) {
    const scrollWrap = routePanel?.querySelector('.route-timeline-scroll');
    const stage = routePanel?.querySelector('.route-timeline-stage');
    const svg = routePanel?.querySelector('.route-timeline-svg');
    const segments = routePanel ? [...routePanel.querySelectorAll('.route-timeline-segment')] : [];
    if (!scrollWrap || !stage || !svg || !segments.length) return;
    const viewBoxWidth = svg.viewBox?.baseVal?.width || 0;
    const renderedWidth = svg.getBoundingClientRect().width;
    if (!viewBoxWidth || !renderedWidth) return;
    const scale = renderedWidth / viewBoxWidth;
    const firstCenter = Number(segments[0].dataset.centerX || 0) * scale;
    const lastCenter = Number(segments[segments.length - 1].dataset.centerX || 0) * scale;
    const leftPad = Math.max(0, Math.round(scrollWrap.clientWidth / 2 - firstCenter));
    const rightPad = Math.max(0, Math.round(scrollWrap.clientWidth / 2 - (renderedWidth - lastCenter)));
    stage.style.setProperty('--timeline-edge-pad-left', `${leftPad}px`);
    stage.style.setProperty('--timeline-edge-pad-right', `${rightPad}px`);
  }

  function stopRouteTimelineInertia(scrollWrap) {
    if (scrollWrap._timelineInertiaFrame) {
      cancelAnimationFrame(scrollWrap._timelineInertiaFrame);
      scrollWrap._timelineInertiaFrame = null;
    }
  }

  function startRouteTimelineInertia(scrollWrap, velocity) {
    stopRouteTimelineInertia(scrollWrap);
    if (Math.abs(velocity) < 0.02) {
      updateRouteTimelineMask(scrollWrap);
      return;
    }
    let currentVelocity = velocity;
    let lastTime = performance.now();
    const step = (now) => {
      const dt = Math.min(32, Math.max(1, now - lastTime));
      lastTime = now;
      scrollWrap.scrollLeft -= currentVelocity * dt;
      updateRouteTimelineMask(scrollWrap);
      currentVelocity *= 0.92;
      if (Math.abs(currentVelocity) < 0.02) {
        scrollWrap._timelineInertiaFrame = null;
        return;
      }
      scrollWrap._timelineInertiaFrame = requestAnimationFrame(step);
    };
    scrollWrap._timelineInertiaFrame = requestAnimationFrame(step);
  }

  function attachStripDragScroll(strip, suppressEl) {
    if (!strip || strip.dataset.dragScrollBound === 'true') return;
    strip.dataset.dragScrollBound = 'true';
    const clickGuard = suppressEl || strip;
    let pointerId = null, startX = 0, startScrollLeft = 0;
    let hasPointerCapture = false;
    let lastX = 0, lastTime = 0, velocity = 0, moved = false;
    const DRAG_THRESHOLD = 5;
    const stopDrag = () => {
      if (pointerId != null && hasPointerCapture && strip.hasPointerCapture(pointerId)) strip.releasePointerCapture(pointerId);
      if (moved) {
        clickGuard.dataset.suppressClickUntil = String(Date.now() + 200);
        let v = velocity;
        const step = () => {
          strip.scrollLeft -= v * 16;
          v *= 0.90;
          if (Math.abs(v) > 0.02) strip._inertia = requestAnimationFrame(step);
          else strip._inertia = null;
        };
        if (strip._inertia) cancelAnimationFrame(strip._inertia);
        strip._inertia = requestAnimationFrame(step);
      }
      strip.classList.remove('dragging-strip');
      pointerId = null; moved = false; velocity = 0; hasPointerCapture = false;
    };
    strip.onpointerdown = (e) => {
      if (e.button > 0) return;
      if (strip._inertia) { cancelAnimationFrame(strip._inertia); strip._inertia = null; }
      pointerId = e.pointerId; startX = e.clientX; startScrollLeft = strip.scrollLeft;
      lastX = e.clientX; lastTime = performance.now(); moved = false; velocity = 0;
      hasPointerCapture = false;
    };
    strip.onpointermove = (e) => {
      if (pointerId !== e.pointerId) return;
      const dx = e.clientX - startX;
      if (!moved && Math.abs(dx) > DRAG_THRESHOLD) {
        moved = true;
        strip.classList.add('dragging-strip');
        if (!hasPointerCapture) {
          strip.setPointerCapture(e.pointerId);
          hasPointerCapture = true;
        }
      }
      if (!moved) return;
      e.preventDefault();
      strip.scrollLeft = startScrollLeft - dx;
      const now = performance.now();
      velocity = (e.clientX - lastX) / Math.max(1, now - lastTime);
      lastX = e.clientX; lastTime = now;
    };
    strip.onpointerup = stopDrag;
    strip.onpointercancel = stopDrag;
  }

  function attachRouteTimelineDragScroll(routePanel) {
    const scrollWrap = routePanel.querySelector('.route-timeline-scroll');
    if (!scrollWrap || scrollWrap.dataset.dragScrollBound === 'true') return;
    updateRouteTimelineEdgePadding(routePanel);
    scrollWrap.dataset.dragScrollBound = 'true';
    let pointerId = null;
    let hasPointerCapture = false;
    let startX = 0;
    let startScrollLeft = 0;
    let moved = false;
    let lastX = 0;
    let lastTime = 0;
    let velocity = 0;
    const DRAG_THRESHOLD = 6;

    const stopDragging = () => {
      if (pointerId != null && hasPointerCapture && scrollWrap.hasPointerCapture(pointerId)) {
        scrollWrap.releasePointerCapture(pointerId);
      }
      if (moved) {
        routePanel.dataset.suppressClickUntil = String(Date.now() + 220);
        startRouteTimelineInertia(scrollWrap, velocity);
      }
      scrollWrap.classList.remove('dragging-timeline');
      pointerId = null;
      moved = false;
      velocity = 0;
      hasPointerCapture = false;
    };

    scrollWrap.onpointerdown = (e) => {
      if (e.button > 0) return;
      stopRouteTimelineInertia(scrollWrap);
      pointerId = e.pointerId;
      startX = e.clientX;
      startScrollLeft = scrollWrap.scrollLeft;
      lastX = e.clientX;
      lastTime = performance.now();
      moved = false;
      velocity = 0;
      hasPointerCapture = false;
    };

    scrollWrap.onpointermove = (e) => {
      if (pointerId !== e.pointerId) return;
      const deltaX = e.clientX - startX;
      if (!moved && Math.abs(deltaX) > DRAG_THRESHOLD) {
        moved = true;
        scrollWrap.classList.add('dragging-timeline');
        if (!hasPointerCapture) {
          scrollWrap.setPointerCapture(e.pointerId);
          hasPointerCapture = true;
        }
      }
      if (!moved) return;
      e.preventDefault();
      scrollWrap.scrollLeft = startScrollLeft - deltaX;
      updateRouteTimelineMask(scrollWrap);
      const now = performance.now();
      const dt = Math.max(1, now - lastTime);
      velocity = (e.clientX - lastX) / dt;
      lastX = e.clientX;
      lastTime = now;
    };

    scrollWrap.onpointerup = stopDragging;
    scrollWrap.onpointercancel = stopDragging;
    scrollWrap.onpointerleave = (e) => {
      if (pointerId === e.pointerId && (!hasPointerCapture || !scrollWrap.hasPointerCapture(pointerId))) stopDragging();
    };
    scrollWrap.onscroll = () => updateRouteTimelineMask(scrollWrap);
    updateRouteTimelineMask(scrollWrap);
  }

  function attachDayRouteInteractions(date) {
    const routePanel = document.getElementById(`dayRoutePanel-${date}`);
    if (!routePanel) return;
    attachRouteTimelineDragScroll(routePanel);
    attachStripDragScroll(routePanel.querySelector('.route-segment-strip'), routePanel);
    attachStripDragScroll(routePanel.querySelector('.route-stop-strip'), routePanel);
    const ZOOM_STEPS = [1, 1.5, 2, 2.5, 3];
    routePanel.querySelectorAll('.route-zoom-btn').forEach(btn => {
      btn.onclick = () => {
        const current = dayTimelineZoom.get(date) || 1;
        const idx = ZOOM_STEPS.findIndex(s => Math.abs(s - current) < 0.01);
        const safe = idx < 0 ? 0 : idx;
        if (btn.dataset.zoomAction === 'in') {
          if (safe < ZOOM_STEPS.length - 1) dayTimelineZoom.set(date, ZOOM_STEPS[safe + 1]);
        } else {
          if (safe > 0) dayTimelineZoom.set(date, ZOOM_STEPS[safe - 1]);
        }
        refreshDayRoutePanel(date);
      };
    });
    const isClickSuppressed = () => Number(routePanel.dataset.suppressClickUntil || 0) > Date.now();
    routePanel.querySelectorAll('.route-segment-card').forEach(card => {
      const segmentIndex = Number(card.dataset.segmentIndex);
      const stopIndices = parseRouteStopIndices(card.dataset.stopIndices);
      const activityIndex = card.dataset.activityIndex ? Number(card.dataset.activityIndex) : null;
      const activate = () => {
        if (isClickSuppressed()) return;
        toggleRouteSegmentSelection(routePanel, segmentIndex, stopIndices, {
          focusTimeline: true,
          centerSegmentCard: true,
          centerStops: true
        });
      };
      card.onmouseenter = () => {
        applyRoutePreview(routePanel, getRouteSelectionForSegment(segmentIndex, stopIndices));
        if (activityIndex != null) applyRouteActivityHighlight(routePanel, activityIndex);
      };
      card.onmouseleave = () => {
        clearRoutePreview(routePanel);
        restoreRouteActivityHighlight(routePanel);
      };
      card.onfocus = () => {
        applyRoutePreview(routePanel, getRouteSelectionForSegment(segmentIndex, stopIndices));
        if (activityIndex != null) applyRouteActivityHighlight(routePanel, activityIndex);
      };
      card.onblur = () => {
        clearRoutePreview(routePanel);
        restoreRouteActivityHighlight(routePanel);
      };
      card.onclick = activate;
      card.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate();
        }
      };
    });
    const totalStops = routePanel.querySelectorAll('.route-stop-pill').length;
    routePanel.querySelectorAll('.route-stop-pill').forEach(pill => {
      const index = Number(pill.dataset.stopIndex);
      const activityIndex = getRouteStopActivityIndex(routePanel, index);
      const activate = () => {
        if (isClickSuppressed()) return;
        toggleRouteStopSelection(routePanel, index, totalStops, {
          focusTimeline: true,
          centerSegmentCard: false,
          centerStops: true
        });
      };
      pill.onmouseenter = () => {
        applyRoutePreview(routePanel, getRouteSelectionForStop(index, totalStops));
        if (activityIndex != null) applyRouteActivityHighlight(routePanel, activityIndex);
      };
      pill.onmouseleave = () => {
        clearRoutePreview(routePanel);
        restoreRouteActivityHighlight(routePanel);
      };
      pill.onfocus = () => {
        applyRoutePreview(routePanel, getRouteSelectionForStop(index, totalStops));
        if (activityIndex != null) applyRouteActivityHighlight(routePanel, activityIndex);
      };
      pill.onblur = () => {
        clearRoutePreview(routePanel);
        restoreRouteActivityHighlight(routePanel);
      };
      pill.onclick = activate;
      pill.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate();
        }
      };
    });

    let dragState = null;
    const clearMergeTarget = () => {
      routePanel.querySelectorAll('.route-stop-pill.merge-target').forEach(pill => pill.classList.remove('merge-target'));
      routePanel.querySelectorAll('.route-svg-node.merge-target').forEach(node => node.classList.remove('merge-target'));
    };
    const highlightMergeTarget = (targetIndex) => {
      clearMergeTarget();
      if (targetIndex == null) return;
      routePanel.querySelectorAll(`.route-stop-pill[data-stop-index="${targetIndex}"]`).forEach(pill => pill.classList.add('merge-target'));
      routePanel.querySelectorAll(`.route-svg-node[data-stop-index="${targetIndex}"]`).forEach(node => node.classList.add('merge-target'));
    };
    const finishDrag = (commit = true) => {
      if (!dragState) return;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
      document.removeEventListener('pointercancel', onPointerUp);
      clearMergeTarget();
      dragState.element.classList.remove('dragging', 'drag-origin');
      if (dragState.proxy?.parentNode) dragState.proxy.remove();
      if (dragState.moved) {
        routePanel.dataset.suppressClickUntil = String(Date.now() + 260);
      }
      if (commit && dragState.targetIndex != null && dragState.targetIndex !== dragState.sourceIndex) {
        mergeRouteStopIntoSegmentStart(date, dragState.sourceIndex, dragState.targetIndex);
      }
      dragState = null;
    };
    const onPointerMove = (e) => {
      if (!dragState) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      if (!dragState.moved && Math.hypot(dx, dy) > 6) {
        dragState.moved = true;
        dragState.element.classList.add('dragging', 'drag-origin');
        dragState.proxy.style.transform = `translate(${e.clientX - dragState.offsetX}px, ${e.clientY - dragState.offsetY}px)`;
      }
      if (!dragState.moved) return;
      e.preventDefault();
      dragState.proxy.style.transform = `translate(${e.clientX - dragState.offsetX}px, ${e.clientY - dragState.offsetY}px)`;
      const hoveredElements = document.elementsFromPoint(e.clientX, e.clientY);
      const hoveredPill = hoveredElements
        .map(el => el.closest ? el.closest('.route-stop-pill') : null)
        .find(Boolean);
      const hoveredNode = hoveredElements.find(el => el.classList?.contains('route-svg-node'));
      dragState.targetIndex = null;
      const targetIndex = Number((hoveredPill || hoveredNode)?.dataset?.stopIndex);
      if (Number.isNaN(targetIndex) || targetIndex >= routePanel.querySelectorAll('.route-stop-pill').length - 1 || targetIndex === dragState.sourceIndex) {
        highlightMergeTarget(null);
        return;
      }
      highlightMergeTarget(targetIndex);
      dragState.targetIndex = targetIndex;
    };
    const onPointerUp = () => finishDrag(true);

    const createDragProxy = (element, kind) => {
      const rect = element.getBoundingClientRect();
      const proxy = document.createElement('div');
      proxy.className = 'route-drag-proxy';
      if (kind === 'pill') {
        proxy.innerHTML = element.outerHTML;
        const proxyPill = proxy.firstElementChild;
        proxyPill.classList.remove('active', 'merge-target', 'dragging', 'drag-origin');
        proxyPill.style.width = `${rect.width}px`;
      } else {
        const stroke = element.querySelector('circle')?.getAttribute('stroke') || '#0A84FF';
        proxy.innerHTML = `<svg width="${Math.ceil(rect.width) || 24}" height="${Math.ceil(rect.height) || 24}" viewBox="0 0 ${Math.ceil(rect.width) || 24} ${Math.ceil(rect.height) || 24}" aria-hidden="true"><circle cx="${(Math.ceil(rect.width) || 24) / 2}" cy="${(Math.ceil(rect.height) || 24) / 2}" r="7" fill="#fff" stroke="${stroke}" stroke-width="2.5"></circle></svg>`;
      }
      document.body.appendChild(proxy);
      return { proxy, rect };
    };

    const startStopDrag = (e, element, sourceIndex, kind) => {
      if (e.button > 0) return;
      const { proxy, rect } = createDragProxy(element, kind);
      dragState = {
        kind,
        element,
        proxy,
        sourceIndex,
        targetIndex: null,
        startX: e.clientX,
        startY: e.clientY,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top,
        moved: false
      };
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
      document.addEventListener('pointercancel', onPointerUp);
    };

    routePanel.querySelectorAll('.route-svg-node').forEach(node => {
      node.onclick = null;
      node.onmouseenter = null;
      node.onmouseleave = null;
      node.onpointerdown = null;
    });
    routePanel.querySelectorAll('.route-svg-segment').forEach(segment => {
      segment.onclick = null;
      segment.onmouseenter = null;
      segment.onmouseleave = null;
    });
    routePanel.querySelectorAll('.route-timeline-segment').forEach(segment => {
      const activityIndex = Number(segment.dataset.activityIndex);
      const activate = () => {
        if (isClickSuppressed()) return;
        const linkedSelection = getRouteSelectionForActivity(routePanel, activityIndex);
        if (linkedSelection) {
          const isSameSegment = routePanel.dataset.activeType === 'segment'
            && Number(routePanel.dataset.activeIndex) === linkedSelection.index;
          applyRouteSelection(routePanel, isSameSegment ? null : linkedSelection);
          if (!isSameSegment) {
            focusRouteSelection(routePanel, linkedSelection, {
              focusTimeline: false,
              centerSegmentCard: true,
              centerStops: true
            });
          }
        }
        const sameActivity = routePanel.dataset.pinnedActivityIndex === String(activityIndex);
        setPinnedRouteActivityHighlight(routePanel, sameActivity ? null : activityIndex);
        if (!sameActivity) focusRouteTimelineActivity(routePanel, activityIndex);
      };
      segment.onmouseenter = () => {
        const linkedSelection = getRouteSelectionForActivity(routePanel, activityIndex);
        if (linkedSelection) applyRoutePreview(routePanel, linkedSelection);
        applyRouteActivityHighlight(routePanel, activityIndex);
      };
      segment.onmouseleave = () => {
        clearRoutePreview(routePanel);
        restoreRouteActivityHighlight(routePanel);
      };
      segment.onfocus = () => {
        const linkedSelection = getRouteSelectionForActivity(routePanel, activityIndex);
        if (linkedSelection) applyRoutePreview(routePanel, linkedSelection);
        applyRouteActivityHighlight(routePanel, activityIndex);
      };
      segment.onblur = () => {
        clearRoutePreview(routePanel);
        restoreRouteActivityHighlight(routePanel);
      };
      segment.onclick = activate;
      segment.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate();
        }
      };
    });

    let endpointDragState = null;
    const stopEndpointDrag = (commit = true) => {
      if (!endpointDragState) return;
      document.removeEventListener('pointermove', onEndpointDragMove);
      document.removeEventListener('pointerup', onEndpointDragUp);
      document.removeEventListener('pointercancel', onEndpointDragUp);
      endpointDragState.endpoint.classList.remove('dragging');
      hideRouteTimelineTooltip(routePanel);
      if (endpointDragState.moved) routePanel.dataset.suppressClickUntil = String(Date.now() + 220);
      if (commit && endpointDragState.moved) {
        const plan = getPlan(currentPlanId);
        const dayData = plan?.days?.[date];
        const activity = dayData?.activities?.[endpointDragState.activityIndex];
        if (activity) {
          const nextRange = clampActivityRange(
            snapMinutesToQuarter(endpointDragState.currentStartMin),
            snapMinutesToQuarter(endpointDragState.currentEndMin)
          );
          activity.startTime = minToTime(nextRange.startMin);
          activity.endTime = minToTime(nextRange.endMin);
          save();
          refreshDayTimelineAndRoute(date);
        }
      }
      endpointDragState = null;
    };

    const onEndpointDragMove = (e) => {
      if (!endpointDragState || endpointDragState.pointerId !== e.pointerId) return;
      const rawMin = getRouteTimelineMinutesFromClientX(endpointDragState.svg, e.clientX);
      const nextMin = getSoftSnappedTimelineMinutes(rawMin);
      if (!endpointDragState.moved && Math.abs(e.clientX - endpointDragState.startX) > 4) {
        endpointDragState.moved = true;
        endpointDragState.endpoint.classList.add('dragging');
      }
      if (!endpointDragState.moved) return;
      e.preventDefault();
      if (endpointDragState.endpointType === 'start') {
        endpointDragState.currentStartMin = Math.min(nextMin, endpointDragState.origEndMin - 15);
      } else {
        endpointDragState.currentEndMin = Math.max(nextMin, endpointDragState.origStartMin + 15);
      }
      updateRouteTimelineSegmentPreview(
        endpointDragState.segment,
        endpointDragState.currentStartMin,
        endpointDragState.currentEndMin
      );
      const label = endpointDragState.endpointType === 'start'
        ? `开始 ${minToTime(endpointDragState.currentStartMin)}`
        : `结束 ${minToTime(endpointDragState.currentEndMin)}`;
      showRouteTimelineTooltip(routePanel, e.clientX, e.clientY, label);
    };

    const onEndpointDragUp = () => stopEndpointDrag(true);

    const beginRouteTimelineEndpointDrag = (e, endpoint) => {
      if (e.button > 0 || !endpoint) return;
      e.stopPropagation();
      const segment = endpoint.closest('.route-timeline-segment');
      const activityIndex = Number(segment?.dataset.activityIndex);
      const plan = getPlan(currentPlanId);
      const dayData = plan?.days?.[date];
      const activity = dayData?.activities?.[activityIndex];
      const svg = endpoint.closest('.route-timeline-svg');
      if (!segment || !activity || !svg) return;
      endpointDragState = {
        pointerId: e.pointerId,
        endpoint,
        endpointType: endpoint.dataset.endpoint,
        segment,
        svg,
        activityIndex,
        startX: e.clientX,
        moved: false,
        origStartMin: timeToMin(activity.startTime),
        origEndMin: timeToMin(activity.endTime),
        currentStartMin: timeToMin(activity.startTime),
        currentEndMin: timeToMin(activity.endTime)
      };
      document.addEventListener('pointermove', onEndpointDragMove);
      document.addEventListener('pointerup', onEndpointDragUp);
      document.addEventListener('pointercancel', onEndpointDragUp);
    };

    routePanel.querySelectorAll('.route-timeline-endpoint, .route-timeline-endpoint-hit').forEach(endpoint => {
      endpoint.onpointerdown = (e) => {
        const segment = endpoint.closest('.route-timeline-segment');
        const endpointType = endpoint.dataset.endpoint;
        const actualEndpoint = endpoint.classList.contains('route-timeline-endpoint-hit')
          ? segment?.querySelector(`.route-timeline-endpoint[data-endpoint="${endpointType}"]`)
          : endpoint;
        beginRouteTimelineEndpointDrag(e, actualEndpoint);
      };
    });

    routePanel.querySelectorAll('.route-timeline-connector, .route-timeline-connector-hit').forEach(connector => {
      connector.onpointerdown = (e) => {
        const segment = connector.closest('.route-timeline-segment');
        const startEndpoint = segment?.querySelector('.route-timeline-endpoint.start');
        if (!startEndpoint) return;
        beginRouteTimelineEndpointDrag(e, startEndpoint);
      };
    });
  }

  function buildDayRoute(date, dayData) {
    const stops = [];
    const indexedActivities = (dayData?.activities || []).map((activity, activityIndex) => ({ ...activity, activityIndex }));
    sortActivitiesByTime(indexedActivities).forEach(activity => {
      const tag = dayData?.tags?.find(item => item.id === activity.tagId);
      if (isUndecidedActivity(activity)) return;
      if (isTransportActivity(activity)) {
        const startLocation = String(activity.startLocation || '').trim();
        const endLocation = String(activity.endLocation || '').trim();
        if (!startLocation || !endLocation) return;
        const title = getActivityDisplayTitle(activity);
        if (stops.length === 0) {
          appendRouteStop(stops, {
            location: startLocation,
            title: '出发',
            startTime: activity.startTime,
            endTime: activity.startTime,
            date,
            outgoingRefs: [{ activityIndex: activity.activityIndex, kind: 'transport-start' }]
          });
        } else if (stops[stops.length - 1].location !== startLocation) {
          appendRouteStop(stops, {
            location: startLocation,
            title: '衔接',
            startTime: activity.startTime,
            endTime: activity.startTime,
            date,
            transportMode: 'walk',
            travelDurationMinutes: 0,
            implicitTransport: true,
            outgoingRefs: [{ activityIndex: activity.activityIndex, kind: 'transport-start' }]
          });
        } else {
          appendRouteStop(stops, {
            location: startLocation,
            startTime: activity.startTime,
            endTime: activity.startTime,
            date,
            outgoingRefs: [{ activityIndex: activity.activityIndex, kind: 'transport-start' }]
          });
        }
        appendRouteStop(stops, {
          location: endLocation,
          title,
          startTime: activity.endTime,
          endTime: activity.endTime,
          date,
          transportMode: getTransportMode(activity),
          travelDurationMinutes: getActivityDurationMinutes(activity),
          incomingRefs: [{ activityIndex: activity.activityIndex, kind: 'transport-end' }]
        });
        return;
      }
      const location = getActivityLocation(activity);
      if (!location) return;
      const lastStop = stops[stops.length - 1];
      if (lastStop && lastStop.location !== location) {
        appendRouteStop(stops, {
          location,
          title: getActivityDisplayTitle(activity),
          startTime: activity.startTime,
          endTime: activity.endTime,
          date,
          tagId: activity.tagId,
          tagIcon: tag?.icon || '',
          tagColor: tag?.color || '',
          tagName: tag?.name || '',
          transportMode: 'walk',
          travelDurationMinutes: 0,
          implicitTransport: true,
          incomingRefs: [{ activityIndex: activity.activityIndex, kind: 'implicit-arrival' }],
          stayRefs: [{ activityIndex: activity.activityIndex, kind: 'stay' }]
        });
        return;
      }
      appendRouteStop(stops, {
        location,
        title: getActivityDisplayTitle(activity),
        startTime: activity.startTime,
        endTime: activity.endTime,
        date,
        tagId: activity.tagId,
        tagIcon: tag?.icon || '',
        tagColor: tag?.color || '',
        tagName: tag?.name || '',
        stayRefs: [{ activityIndex: activity.activityIndex, kind: 'stay' }]
      });
    });
    return {
      date,
      stops,
      start: stops[0]?.location || '',
      end: stops[stops.length - 1]?.location || ''
    };
  }

  function buildPlanRoute(plan) {
    const dayRoutes = getDaysArray(plan.startDate, plan.endDate)
      .map(date => buildDayRoute(date, plan.days?.[date]))
      .filter(route => route.stops.length > 0);
    const stops = [];
    dayRoutes.forEach((dayRoute, dayRouteIndex) => {
      dayRoute.stops.forEach((stop, stopIndex) => {
        const nextStop = {
          ...stop,
          startDate: stop.startDate || stop.date || '',
          endDate: stop.endDate || stop.date || '',
          incomingRefs: [...(stop.incomingRefs || [])],
          outgoingRefs: [...(stop.outgoingRefs || [])],
          stayRefs: [...(stop.stayRefs || [])]
        };
        const lastStop = stops[stops.length - 1];
        if (dayRouteIndex > 0 && stopIndex === 0 && lastStop && lastStop.location === nextStop.location) {
          mergeRouteStopData(lastStop, nextStop);
          return;
        }
        if (dayRouteIndex > 0 && stopIndex === 0 && lastStop && lastStop.location !== nextStop.location) {
          nextStop.unresolvedGap = true;
          nextStop.transportMode = '';
          nextStop.travelDurationMinutes = 0;
          nextStop.implicitTransport = false;
          nextStop.tagId = '';
          nextStop.tagIcon = '';
          nextStop.tagColor = '';
          nextStop.tagName = '';
        }
        if (canMergeRouteStops(lastStop, nextStop)) return;
        stops.push(nextStop);
      });
    });
    return {
      dayRoutes,
      stops,
      start: stops[0]?.location || '',
      end: stops[stops.length - 1]?.location || ''
    };
  }

  function getRoutePreviewLabel(stops, maxItems = 3) {
    if (!stops.length) return '添加活动地点后会自动生成路线预览';
    const names = stops.slice(0, maxItems).map(stop => stop.location);
    if (stops.length > maxItems) names.push(`+${stops.length - maxItems}`);
    return names.join('  ·  ');
  }

  function getPlanRoutePreviewMeta(route) {
    if (!route?.stops?.length) return '尚未生成路线记录';
    const parts = [`${route.dayRoutes.length} 天`, formatRouteStopCount(route)];
    const travelDuration = getRouteTravelDurationMinutes(route);
    if (travelDuration) parts.push(`在途 ${formatDurationHours(travelDuration)}`);
    return parts.join('  ·  ');
  }

  function getPlanRouteHeadline(route) {
    if (!route?.stops?.length) return '尚未生成';
    return `${route.start} → ${route.end}`;
  }

  function renderPlanRoutePreviewDaySummaries(plan, route, maxItems = 2) {
    return route.dayRoutes.slice(0, maxItems).map(dayRoute => {
      const daySummary = summarizeDayByDefaultTags(plan.days?.[dayRoute.date]);
      return `<span class="route-day-summary-chip" style="background:${toAlphaColor(daySummary.mode.color, 0.12)}; color:${daySummary.mode.color};">${escapeHtml(formatRouteDate(dayRoute.date))} · ${escapeHtml(daySummary.mode.title)}</span>`;
    }).join('');
  }

  function renderPlanRoutePreviewBadges(plan, route) {
    const dayBadges = renderPlanRoutePreviewDaySummaries(plan, route, 1);
    const extraDayBadge = route.dayRoutes.length > 1
      ? `<span class="plan-card-route-badge-more">+${route.dayRoutes.length - 1} 天</span>`
      : '';
    const modes = getRouteTransportSummary(route.stops, route.stops.length);
    const primaryModeBadge = modes.length ? renderTransportChip(modes[0].id) : '';
    const extraModeBadge = modes.length > 1
      ? `<span class="plan-card-route-badge-more">+${modes.length - 1} 种交通</span>`
      : '';
    return `${dayBadges}${extraDayBadge}${primaryModeBadge}${extraModeBadge}`;
  }

  function getRouteSvgLabelIndices(totalStops, compact = false) {
    if (totalStops <= 0) return [];
    if (totalStops === 1) return [0];
    if (!compact) return [0, totalStops - 1];
    if (totalStops <= 3) return Array.from({ length: totalStops }, (_, index) => index);
    const middle = Math.floor((totalStops - 1) / 2);
    return Array.from(new Set([0, middle, totalStops - 1]));
  }
  
  function getRouteSvgStopLabel(location, maxLength = 4) {
    const text = String(location || '').trim();
    if (!text) return '未定';
    return text.length > maxLength ? `${text.slice(0, maxLength)}…` : text;
  }

  function buildDayRouteActivitySegments(dayData) {
    const indexedActivities = (dayData?.activities || []).map((activity, activityIndex) => ({ ...activity, activityIndex }));
    const ordered = sortActivitiesByTime(indexedActivities);
    const tagMap = new Map((dayData?.tags || []).map(tag => [tag.id, tag]));
    const locations = [];
    const locationIndexMap = new Map();
    const registerLocation = location => {
      const key = String(location || '').trim();
      if (!key) return '';
      if (!locationIndexMap.has(key)) {
        locationIndexMap.set(key, locations.length);
        locations.push(key);
      }
      return key;
    };
    const segments = ordered.map(activity => {
      if (isUndecidedActivity(activity)) return null;
      const startMin = timeToMin(activity.startTime);
      const endMin = timeToMin(activity.endTime);
      if (!Number.isFinite(startMin) || !Number.isFinite(endMin) || endMin < startMin) return null;
      if (isTransportActivity(activity)) {
        const startLocation = registerLocation(activity.startLocation);
        const endLocation = registerLocation(activity.endLocation);
        if (!startLocation || !endLocation) return null;
        const meta = getTransportMeta(getTransportMode(activity));
        return {
          kind: 'transport',
          activityIndex: activity.activityIndex,
          title: getActivityDisplayTitle(activity),
          startMin,
          endMin,
          startLocation,
          endLocation,
          icon: meta.icon,
          color: meta.color,
          dash: meta.dash || '0'
        };
      }
      const location = registerLocation(getActivityLocation(activity));
      if (!location) return null;
      const tag = tagMap.get(activity.tagId);
      return {
        kind: 'activity',
        activityIndex: activity.activityIndex,
        title: getActivityDisplayTitle(activity),
        startMin,
        endMin,
        startLocation: location,
        endLocation: location,
        icon: tag?.icon || '•',
        color: tag?.color || '#64748B',
        dash: '0'
      };
    }).filter(Boolean);
    return { segments, locations };
  }

  function renderDayActivityRouteSvg(dayData) {
    const { segments, locations } = buildDayRouteActivitySegments(dayData);
    if (!segments.length || !locations.length) return '';
    const width = 520;
    const leftPad = 52;
    const rightPad = 8;
    const topPad = 28;
    const bottomPad = 42;
    const rowGap = locations.length <= 1 ? 0 : 30;
    const usableWidth = width - leftPad - rightPad;
    const minTime = Math.min(...segments.map(segment => segment.startMin));
    const maxTime = Math.max(...segments.map(segment => segment.endMin));
    const paddedStart = Math.max(0, minTime - 16);
    const paddedEnd = Math.min(24 * 60, Math.max(maxTime + 16, paddedStart + 60));
    const timeRange = Math.max(60, paddedEnd - paddedStart);
    const height = topPad + Math.max(1, locations.length - 1) * rowGap + bottomPad + 14;
    const yForLocation = location => {
      const index = locationIndexMap.get(location);
      return topPad + (index != null ? index * rowGap : 0);
    };
    const locationIndexMap = new Map(locations.map((location, index) => [location, index]));
    const xForMinute = minute => leftPad + (usableWidth * (minute - paddedStart)) / timeRange;
    const positioned = segments.map(segment => {
      const x1 = xForMinute(segment.startMin);
      const x2 = Math.max(xForMinute(segment.endMin), x1 + 18);
      const y1 = yForLocation(segment.startLocation);
      const y2 = yForLocation(segment.endLocation);
      const labelY = Math.min(height - 12, Math.max(y1, y2) + 18);
      return {
        ...segment,
        x1,
        x2,
        y1,
        y2,
        labelY,
        midX: (x1 + x2) / 2,
        midY: (y1 + y2) / 2
      };
    });
    const tickCount = Math.min(5, Math.max(2, Math.round(timeRange / 180) + 1));
    const ticks = Array.from({ length: tickCount }, (_, index) => {
      const minute = paddedStart + (timeRange * index) / Math.max(1, tickCount - 1);
      return Math.round(minute / 15) * 15;
    });
    const connectors = positioned.slice(1).map((segment, index) => {
      const previous = positioned[index];
      const isContiguous = previous.endMin === segment.startMin;
      const fromX = previous.x2;
      const fromY = previous.y2;
      const toX = segment.x1;
      const toY = segment.y1;
      const isZeroLength = Math.abs(fromX - toX) < 0.5 && Math.abs(fromY - toY) < 0.5;
      if (isZeroLength) return null;
      return {
        fromX,
        fromY,
        toX,
        toY,
        color: isContiguous ? segment.color : '#94A3B8',
        dash: isContiguous ? '0' : '7 7',
        opacity: isContiguous ? 0.7 : 0.72
      };
    }).filter(Boolean);
    return `
      <svg class="route-svg route-day-activity-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        ${ticks.map(minute => {
          const x = xForMinute(minute);
          return `
            <g>
              <line x1="${x}" y1="10" x2="${x}" y2="${height - 10}" stroke="rgba(148,163,184,0.14)" stroke-width="1"></line>
              <text x="${x}" y="12" text-anchor="middle" font-size="10" fill="#94A3B8">${minToTime(minute)}</text>
            </g>`;
        }).join('')}
        ${locations.map(location => {
          const y = yForLocation(location);
          return `
            <text x="${leftPad - 10}" y="${y + 4}" text-anchor="end" font-size="11" fill="#64748B" stroke="rgba(255,255,255,0.92)" stroke-width="3" paint-order="stroke">${escapeHtml(getRouteSvgStopLabel(location, 8))}</text>`;
        }).join('')}
        ${connectors.map(connector => `
          <path class="route-svg-connector" d="M ${connector.fromX} ${connector.fromY} L ${connector.toX} ${connector.toY}" fill="none" stroke="${connector.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${connector.dash}" opacity="${connector.opacity}"></path>`).join('')}
        ${positioned.map(segment => `
          <g class="route-svg-activity" data-activity-index="${segment.activityIndex}">
            <path class="route-svg-activity-segment" d="M ${segment.x1} ${segment.y1} L ${segment.x2} ${segment.y2}" fill="none" stroke="${segment.color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${segment.dash}" opacity="0.9"></path>
            <circle cx="${segment.x1}" cy="${segment.y1}" r="4.2" fill="#fff" stroke="${segment.color}" stroke-width="2.2"></circle>
            <circle cx="${segment.x2}" cy="${segment.y2}" r="4.2" fill="#fff" stroke="${segment.color}" stroke-width="2.2"></circle>
            <g transform="translate(${segment.midX}, ${segment.labelY})" pointer-events="none">
              <rect x="-19" y="-10" width="38" height="20" rx="10" fill="rgba(255,255,255,0.96)"></rect>
              <text text-anchor="middle" dominant-baseline="central" font-size="11" fill="${segment.color}">${escapeHtml(segment.icon)}</text>
            </g>
          </g>`).join('')}
      </svg>`;
  }

  function renderPlanDaySummarySvg(route, options = {}) {
    const { compact = false } = options;
    const dayRoutes = route?.dayRoutes || [];
    if (!dayRoutes.length) return '';
    const width = compact ? 280 : Math.max(520, dayRoutes.length * 180);
    const height = compact ? 74 : 124;
    const paddingX = compact ? 24 : 40;
    const usableWidth = width - paddingX * 2;
    const wave = compact ? [0, 8, -6, 10] : [0, 10, -8, 12, -6];
    const pointCount = dayRoutes.length + 1;
    const labelIndexSet = new Set(compact ? [0, Math.max(0, pointCount - 1)] : getRouteSvgLabelIndices(pointCount, false));
    const pointLabelMaxLen = compact ? 4 : 8;
    const points = Array.from({ length: pointCount }, (_, index) => {
      const x = pointCount === 1 ? width / 2 : paddingX + (usableWidth * index) / Math.max(1, pointCount - 1);
      const y = height / 2 + wave[index % wave.length];
      const location = index === 0 ? dayRoutes[0].start : dayRoutes[index - 1].end;
      const previousMode = index > 0 ? (getRouteTransportSummary(dayRoutes[index - 1].stops, 1)[0] || null) : null;
      const nextMode = index < dayRoutes.length ? (getRouteTransportSummary(dayRoutes[index].stops, 1)[0] || null) : null;
      return {
        x,
        y,
        location,
        color: previousMode?.color || nextMode?.color || '#64748B'
      };
    });
    const segments = dayRoutes.map((dayRoute, index) => {
      const from = points[index];
      const to = points[index + 1];
      const mode = getRouteTransportSummary(dayRoute.stops, 1)[0] || null;
      return {
        date: dayRoute.date,
        from,
        to,
        color: mode?.color || '#64748B',
        icon: mode?.icon || '•',
        label: formatRouteDate(dayRoute.date)
      };
    });
    const svg = `
      <svg class="route-svg${compact ? ' compact' : ''} plan-svg route-plan-day-svg${compact ? ' compact' : ''}"${compact ? '' : ` style="width:${width}px"`} viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        ${segments.map(segment => `
          <g>
            <path class="route-svg-segment" d="M ${segment.from.x} ${segment.from.y} L ${segment.to.x} ${segment.to.y}" fill="none" stroke="${segment.color}" stroke-width="${compact ? 4 : 5}" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"></path>
            <g transform="translate(${(segment.from.x + segment.to.x) / 2}, ${Math.min(segment.from.y, segment.to.y) - (compact ? 12 : 16)})" pointer-events="none">
              <rect x="${compact ? -10 : -24}" y="-10" width="${compact ? 20 : 48}" height="20" rx="10" fill="rgba(255,255,255,0.94)"></rect>
              <text text-anchor="middle" dominant-baseline="central" font-size="${compact ? 10 : 10}" fill="${segment.color}">${escapeHtml(compact ? segment.icon : `${segment.icon} ${segment.label}`)}</text>
            </g>
          </g>`).join('')}
        ${points.map((point, index) => `
          <g class="route-svg-node" transform="translate(${point.x}, ${point.y})">
            <circle r="${compact ? 5 : 5.4}" fill="#fff" stroke="${index === 0 ? '#34C759' : index === pointCount - 1 ? '#FF9F0A' : point.color}" stroke-width="${compact ? 2 : 2.4}"></circle>
          </g>`).join('')}
        ${points.map((point, index) => {
          if (!labelIndexSet.has(index)) return '';
          const anchor = index === 0 ? 'start' : (index === pointCount - 1 ? 'end' : 'middle');
          const x = index === 0 ? point.x + 2 : (index === pointCount - 1 ? point.x - 2 : point.x);
          const y = Math.min(height - (compact ? 6 : 8), point.y + (compact ? 18 : (index % 2 === 0 ? 22 : 32)));
          return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${compact ? 9 : 10}" fill="#475569" stroke="rgba(255,255,255,0.94)" stroke-width="3" paint-order="stroke">${escapeHtml(getRouteSvgStopLabel(point.location || '未定', pointLabelMaxLen))}</text>`;
        }).join('')}
      </svg>`;
    if (compact) return svg;
    return `<div class="route-plan-scroll">${svg}</div>`;
  }

  function renderRouteSvg(stops, compact = false, opts = {}) {
    if (!stops.length) return '';
    const { scrollable = false, mergeOverlaps = true } = opts;
    const minPerStop = 68;
    const baseWidth = compact ? 280 : 520;
    const width = scrollable ? Math.max(baseWidth, stops.length * minPerStop) : baseWidth;
    const height = compact ? 74 : 86;
    const paddingX = compact ? 24 : 32;
    const usableWidth = width - paddingX * 2;
    const wave = compact ? [0, 12, -8, 10] : [0, 18, -10, 14, -6];
    const labelIndexSet = scrollable
      ? new Set(stops.map((_, i) => i))
      : new Set(getRouteSvgLabelIndices(stops.length, compact));
    const labelMaxLen = scrollable ? 8 : (compact ? 4 : 6);
    const points = stops.map((stop, index) => {
      const x = stops.length === 1 ? width / 2 : paddingX + (usableWidth / (stops.length - 1)) * index;
      const y = height / 2 + wave[index % wave.length];
      return { ...stop, x, y };
    });
    const segments = buildRouteSegments(stops).map((segment, index) => {
      const from = points[index];
      const to = points[index + 1];
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const length = Math.max(1, Math.hypot(dx, dy));
      const offset = compact ? 2.2 : 3.2;
      return {
        ...segment,
        index,
        from,
        to,
        parallelOffsetX: (-dy / length) * offset,
        parallelOffsetY: (dx / length) * offset,
        midX: (from.x + to.x) / 2,
        midY: (from.y + to.y) / 2
      };
    });
    const svgAttrs = `class="route-svg${compact ? ' compact' : ''}${scrollable ? ' plan-svg' : ''}" `
      + `${scrollable ? `style="width:${width}px" ` : ''}`
      + `viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"`;
    const svgEl = `
      <svg ${svgAttrs}>
        ${!compact ? segments.map(segment => segment.showBadge && !segment.sameLocationImplicit && !segment.neutralGap ? `
          <g transform="translate(${segment.midX}, ${segment.midY - 16})" pointer-events="none">
            <rect x="-20" y="-10" width="40" height="20" rx="10" fill="${mergeOverlaps && segment.overlapsInTime ? 'rgba(255,248,235,0.96)' : 'rgba(255,255,255,0.9)'}"></rect>
            <text text-anchor="middle" dominant-baseline="central" font-size="11" fill="${segment.displayColor}">${segment.displayIcon}</text>
            ${mergeOverlaps && segment.overlapsInTime ? `<text x="13" y="-5" text-anchor="middle" font-size="8" fill="#B45309">并</text>` : ''}
          </g>` : '').join('') : ''}
        ${segments.map(segment => {
          if (segment.sameLocationImplicit || segment.neutralGap) return '';
          if (mergeOverlaps && segment.overlapsInTime) {
            const strokeWidth = compact ? 2 : 2.5;
            return `
                    <path class="route-svg-segment route-svg-segment-parallel${segment.unresolvedGap ? ' unresolved' : ''}" data-segment-index="${segment.index}" data-stop-indices="${segment.stopIndices.join(',')}" d="M ${segment.from.x + segment.parallelOffsetX} ${segment.from.y + segment.parallelOffsetY} L ${segment.to.x + segment.parallelOffsetX} ${segment.to.y + segment.parallelOffsetY}" fill="none" stroke="${segment.strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${segment.meta.dash}" opacity="${getRouteSegmentStrokeOpacity(segment)}"></path>
                    <path class="route-svg-segment route-svg-segment-parallel${segment.unresolvedGap ? ' unresolved' : ''}" data-segment-index="${segment.index}" data-stop-indices="${segment.stopIndices.join(',')}" d="M ${segment.from.x - segment.parallelOffsetX} ${segment.from.y - segment.parallelOffsetY} L ${segment.to.x - segment.parallelOffsetX} ${segment.to.y - segment.parallelOffsetY}" fill="none" stroke="${segment.strokeColor}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${segment.meta.dash}" opacity="${getRouteSegmentStrokeOpacity(segment)}"></path>`;
          }
                  return `<path class="route-svg-segment${segment.unresolvedGap ? ' unresolved' : ''}" data-segment-index="${segment.index}" data-stop-indices="${segment.stopIndices.join(',')}" d="M ${segment.from.x} ${segment.from.y} L ${segment.to.x} ${segment.to.y}" fill="none" stroke="${segment.strokeColor}" stroke-width="${compact ? 4 : 5}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${segment.meta.dash}" opacity="${getRouteSegmentStrokeOpacity(segment)}"></path>`;
        }).join('')}
        ${points.map((point, index) => `
          <g class="route-svg-node" data-stop-index="${index}" data-activity-index="${getRouteStopPrimaryActivityIndex(point) != null ? getRouteStopPrimaryActivityIndex(point) : ''}" transform="translate(${point.x}, ${point.y})">
            <circle r="${compact ? 5 : 6.5}" fill="#fff" stroke="${getRouteStopNodeColor(point, index, points.length)}" stroke-width="${compact ? 2 : 2.5}"></circle>
          </g>`).join('')}
        ${points.map((point, index) => {
          if (!labelIndexSet.has(index)) return '';
          const label = getRouteSvgStopLabel(point.location, labelMaxLen);
          const anchor = index === 0 ? 'start' : (index === points.length - 1 ? 'end' : 'middle');
          const labelX = index === 0 ? point.x + 2 : (index === points.length - 1 ? point.x - 2 : point.x);
          const labelY = Math.min(height - 6, point.y + (compact ? 18 : 20));
          return `<text x="${labelX}" y="${labelY}" text-anchor="${anchor}" font-size="${compact ? 9 : 10}" fill="#64748B" stroke="rgba(255,255,255,0.92)" stroke-width="3" paint-order="stroke">${escapeHtml(label)}</text>`;
        }).join('')}
      </svg>`;
    if (scrollable) return `<div class="route-plan-scroll">${svgEl}</div>`;
    return svgEl;
  }

  function renderPlanRoutePreview(plan) {
    const route = buildPlanRoute(plan);
    if (!route.stops.length) return '<div class="plan-card-route-empty">添加活动地点后，这里会显示整趟旅程的路线 preview</div>';
    return `
      <div class="plan-card-route">
        ${renderPlanDaySummarySvg(route, { compact: true })}
        <div class="plan-card-route-caption">${escapeHtml(getPlanRouteHeadline(route))}</div>
        <div class="plan-card-route-meta">${escapeHtml(getPlanRoutePreviewMeta(route))}</div>
        <div class="plan-card-route-modes">${renderPlanRoutePreviewBadges(plan, route)}</div>
      </div>`;

  function initializeDayTimeline(date, timeline) {
    for (let i = 0; i < 24; i++) {
      const marker = document.createElement('div');
      marker.className = 'hour-marker';
      marker.style.top = `${timelineMinutesToOffset(timeline, i * 60)}px`;
      const label = document.createElement('span');
      label.className = 'hour-label';
      label.textContent = `${i}:00`;
      const line = document.createElement('div');
      line.className = 'hour-line';
      marker.appendChild(label);
      marker.appendChild(line);
      timeline.appendChild(marker);
    }
    const indicator = document.createElement('div');
    indicator.className = 'time-indicator';
    indicator.id = `indicator-${date}`;
    indicator.innerHTML = '<span class="time-indicator-text"></span>';
    timeline.appendChild(indicator);
    const createPreview = document.createElement('div');
    createPreview.className = 'create-preview';
    createPreview.id = `create-preview-${date}`;
    timeline.appendChild(createPreview);

    drawActivities(date, timeline);

    let createDragging = false;
    let createStartY = 0;
    let createStartMin = 0;
    let createPreviewEndMin = 0;
    let createDragThreshold = 5;
    let createPointerId = null;
    const createSnapHaptic = { value: null };
    const cp = document.getElementById(`create-preview-${date}`);
    const ind = document.getElementById(`indicator-${date}`);

    timeline.addEventListener('pointerdown', (e) => {
      if (!e.target.classList.contains('timeline') &&
          !e.target.classList.contains('hour-marker') &&
          !e.target.classList.contains('hour-line') &&
          !e.target.classList.contains('hour-label')) return;
      e.preventDefault();
      createStartMin = snapMinutesToQuarter(timelineClientYToMinutes(timeline, e.clientY));
      createPreviewEndMin = createStartMin;
      createStartY = e.clientY;
      createDragging = false;
      createDragThreshold = getPointerDragThreshold(e, 5, 2);
      createPointerId = e.pointerId;
      createSnapHaptic.value = createStartMin;
      if (timeline.setPointerCapture) timeline.setPointerCapture(e.pointerId);
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
      document.addEventListener('pointercancel', onPointerUp);
    });

    function onPointerMove(e) {
      if (Math.abs(e.clientY - createStartY) > createDragThreshold && !createDragging) {
        createDragging = true;
        snapshotDate(date);
        cp.style.display = 'flex';
        triggerHaptic('soft');
        showTimeIndicator(ind, createStartMin);
      }
      if (!createDragging) return;
      e.preventDefault();
      const clampedMin = timelineClientYToMinutes(timeline, e.clientY);
      createPreviewEndMin = clampTime(clampedMin);
      const start = createStartMin;
      const end = createPreviewEndMin;
      setTimelineSpanPosition(cp, timeline, Math.min(start, end), Math.max(start, end));
      const snappedEnd = updateSnapHapticState(createSnapHaptic, createPreviewEndMin);
      const previewStart = Math.min(createStartMin, snappedEnd);
      const previewEnd = Math.max(createStartMin, snappedEnd);
      const startTime = minToTime(previewStart);
      const endTime = minToTime(previewEnd);
      cp.innerHTML = `<div class="create-preview-inner"><span class="create-preview-range">${startTime} → ${endTime}</span><span class="create-preview-duration">${formatDurationHours(Math.max(15, previewEnd - previewStart))}</span></div>`;
      showTimeIndicator(ind, Math.max(start, snappedEnd));
    }

    function onPointerUp(e) {
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
      document.removeEventListener('pointercancel', onPointerUp);
      cp.style.display = 'none';
      cp.innerHTML = '';
      hideTimeIndicator(ind);
      if (createPointerId != null && timeline.hasPointerCapture && timeline.hasPointerCapture(createPointerId)) {
        timeline.releasePointerCapture(createPointerId);
      }
      if (e?.type === 'pointercancel') {
        createPointerId = null;
        createSnapHaptic.value = null;
        return;
      }
      if (createDragging) {
        const clampedEnd = snapMinutesToQuarter(createPreviewEndMin);
        const startTime = minToTime(Math.min(createStartMin, clampedEnd));
        const endTime = minToTime(Math.max(createStartMin, clampedEnd));
        if (startTime !== endTime) openActivityModal(date, startTime, null, endTime);
      } else {
        openActivityModal(date, minToTime(createStartMin));
      }
      createPointerId = null;
      createSnapHaptic.value = null;
    }

    function showTimeIndicator(indicatorEl, minutes) {
      indicatorEl.style.top = `${timelineMinutesToOffset(timeline, minutes)}px`;
      indicatorEl.querySelector('.time-indicator-text').textContent = minToTime(minutes);
      indicatorEl.style.display = 'flex';
    }

    function hideTimeIndicator(indicatorEl) {
      indicatorEl.style.display = 'none';
    }
  }

  const DAY_UI_SECTION = Object.freeze({
    editor: 'editor',
    tagBar: 'tagBar',
    timeline: 'timeline',
    timelineSection: 'timelineSection',
    dayRoute: 'dayRoute',
    dayRouteSection: 'dayRouteSection'
  });

  function mergeDayUiSections(...sectionGroups) {
    return Array.from(new Set(sectionGroups
      .flatMap(group => Array.isArray(group) ? group : [group])
      .filter(Boolean)));
  }

  function withDayUiSections(defaultSections, options = {}) {
    return {
      ...options,
      sections: mergeDayUiSections(defaultSections, options.sections)
    };
  }

  function normalizeDayUiSections(options = {}) {
    const sections = new Set();
    const hasExplicitSections = Object.prototype.hasOwnProperty.call(options, 'sections');
    if (hasExplicitSections) {
      mergeDayUiSections(options.sections).forEach(section => sections.add(section));
    } else if (options.editor !== false) {
      sections.add(DAY_UI_SECTION.editor);
    }
    if (options.editor) sections.add(DAY_UI_SECTION.editor);
    if (options.tagBar) sections.add(DAY_UI_SECTION.tagBar);
    if (options.timelineSection) {
      sections.delete(DAY_UI_SECTION.timeline);
      sections.add(DAY_UI_SECTION.timelineSection);
    } else if (options.timeline) {
      sections.add(DAY_UI_SECTION.timeline);
    }
    if (options.dayRouteSection) {
      sections.delete(DAY_UI_SECTION.dayRoute);
      sections.add(DAY_UI_SECTION.dayRouteSection);
    } else if (options.dayRoute) {
      sections.add(DAY_UI_SECTION.dayRoute);
    }
    return sections;
  }

  function enterSelectionMode(initialPlanId = null) {
    if (selectionMode) {
      if (initialPlanId != null) selectedPlanIds.add(initialPlanId);
      renderMain();
      return;
    }
    clearDeletedPlan();
    if (cardDragState) endCardDrag(false);

    if (initialPlanId != null) selectedPlanIds.add(initialPlanId);
    triggerHaptic('soft');

  function exitSelectionMode() {
    selectionMode = false;
    selectedPlanIds.clear();
    clearCardLongPress();
    suppressPlanOpenId = null;
    renderMain();

  function togglePlanSelection(id) {
    if (!selectionMode) return;
    if (selectedPlanIds.has(id)) selectedPlanIds.delete(id);
    else selectedPlanIds.add(id);

    renderMain();

  function moveSelectedPlansToTop() {
    if (!selectedPlanIds.size) return;
    const selected = [];
    const rest = [];
    plans.forEach(plan => {
      if (selectedPlanIds.has(plan.id)) selected.push(plan);
      else rest.push(plan);
    });
    plans = [...selected, ...rest];
    save();
    triggerHaptic('success');
    exitSelectionMode();
  }

  function duplicateSelectedPlans() {
    const entries = getSelectedPlanEntries();
    if (!entries.length) return;
    const insertIndex = entries[entries.length - 1].index + 1;
    const copies = entries.map(({ plan }) => clonePlan(plan));
    plans.splice(insertIndex, 0, ...copies);
    save();
    triggerHaptic('success');
    exitSelectionMode();
  }

  function triggerHaptic(pattern = 'tick') {
    if (!navigator.vibrate) return;
    if (pattern === 'soft') navigator.vibrate(8);
    else if (pattern === 'success') navigator.vibrate([10, 30, 12]);
    else navigator.vibrate(6);
  }

  function ensureToast() {
    let toast = uiLayerState.toast || document.getElementById('deleteToast');
    if (toast) return toast;
    toast = document.createElement('div');
    toast.id = 'deleteToast';
    toast.className = 'toast';
    toast.innerHTML = `
      <div class="toast-copy">
        <div class="toast-title"></div>
        <div class="toast-subtitle"></div>
      </div>
      <button class="toast-action" type="button">${uiText.action.undo}</button>`;
    document.body.appendChild(toast);
    toast.querySelector('.toast-action').onclick = restoreDeletedPlan;
    uiLayerState.toast = toast;
    return toast;
  }

  function clearToastTimer() {
    if (!ephemeralToastTimer) return;
    clearTimeout(ephemeralToastTimer);
    ephemeralToastTimer = null;
  }

  function hideManagedToast() {
    const toast = uiLayerState.toast || document.getElementById('deleteToast');
    if (!toast) return;
    clearToastTimer();
    toast.classList.remove('visible');
    const action = toast.querySelector('.toast-action');
    action.style.display = '';
    action.textContent = uiText.action.undo;
    action.onclick = restoreDeletedPlan;
  }

  function showManagedToast({ title, subtitle = '', actionLabel = '', actionHandler = null, duration = 0 } = {}) {
    const toast = ensureToast();
    clearToastTimer();
    toast.querySelector('.toast-title').textContent = title;
    toast.querySelector('.toast-subtitle').textContent = subtitle;
    const action = toast.querySelector('.toast-action');
    if (actionLabel && actionHandler) {
      action.style.display = '';
      action.textContent = actionLabel;
      action.onclick = actionHandler;
    } else {
      action.style.display = 'none';
      action.textContent = uiText.action.undo;
      action.onclick = restoreDeletedPlan;
    }
    requestAnimationFrame(() => toast.classList.add('visible'));
    if (duration > 0) {
      ephemeralToastTimer = window.setTimeout(() => {
        hideManagedToast();
      }, duration);
    }
  }

  function showEphemeralToast(title, subtitle = '', duration = 2400) {
    if (deleteToastState) clearDeletedPlan();
    showManagedToast({ title, subtitle, duration });
  }

  function hideDeleteToast() {
    hideManagedToast();
  }

  function clearDeletedPlan(finalize = true) {
    if (deleteToastState?.timer) clearTimeout(deleteToastState.timer);
    if (finalize) deleteToastState = null;
    clearToastTimer();
    hideDeleteToast();

  function showDeleteToast(label) {
    showManagedToast({
      title: uiText.toast.removed(label),
      subtitle: uiText.toast.undoWindow,
      actionLabel: uiText.action.undo,
      actionHandler: restoreDeletedPlan
    });

  function showActionSheet({ badge = '', badgeTone = '', title = '', message = '', actions = [] } = {}) {
    return new Promise((resolve) => {
      let settled = false;
      const sheetHtml = `
        <div class="sheet-overlay" id="actionSheet">
        <div class="sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(title || '操作确认')}">
          <div class="sheet-copy">
            ${badge ? `<div class="sheet-badge${badgeTone ? ` ${escapeHtml(badgeTone)}` : ''}">${escapeHtml(badge)}</div>` : ''}
            <div class="sheet-title">${escapeHtml(title)}</div>
            <div class="sheet-message">${escapeHtml(message)}</div>
          </div>
          <div class="sheet-actions">
            ${actions.map((action, index) => `<button type="button" class="sheet-action ${action.tone || 'secondary'}" data-value="${escapeHtml(action.value)}" ${index === 0 ? 'autofocus' : ''}>${escapeHtml(action.label)}</button>`).join('')}
          </div>
        </div>
        </div>`;
      const { sheet: overlay, close: closeSheet } = mountSheet(sheetHtml);
      const onKeyDown = (e) => {
        if (e.key !== 'Escape') return;
        e.preventDefault();
        close(null);
      };
      const close = (value = null) => {
        if (settled) return;
        settled = true;
        document.removeEventListener('keydown', onKeyDown);
        closeSheet();
        window.setTimeout(() => resolve(value), 190);
      };
      overlay.onclick = (e) => {
        if (e.target === overlay) close(null);
      };
      overlay.querySelectorAll('.sheet-action').forEach((button) => {
        button.onclick = () => close(button.dataset.value || null);
      });
      document.addEventListener('keydown', onKeyDown);
      document.body.appendChild(overlay);
      triggerHaptic('soft');
    });
  }

  function restoreDeletedPlan() {
    if (!deleteToastState) return;
    const { entries } = deleteToastState;
    clearDeletedPlan(false);
    entries.slice().sort((a, b) => a.index - b.index).forEach(({ plan, index }) => {
      const nextIndex = Math.max(0, Math.min(index, plans.length));
      plans.splice(nextIndex, 0, plan);
    });
    save();
    triggerHaptic('success');
    deleteToastState = null;
    renderMain();
  }

  function movePlan(fromIndex, toIndex) {
    if (fromIndex === toIndex || fromIndex < 0 || toIndex < 0 || fromIndex >= plans.length || toIndex >= plans.length) return false;
    const [movedPlan] = plans.splice(fromIndex, 1);
    plans.splice(toIndex, 0, movedPlan);
    save();
    return true;
  }

  function sortPlansByStartDate() {
    if (plans.length < 2) return;
    clearDeletedPlan();
    if (selectionMode) exitSelectionMode();
    plans.sort((a, b) => {
      if (a.startDate !== b.startDate) return a.startDate.localeCompare(b.startDate);
      if (a.endDate !== b.endDate) return a.endDate.localeCompare(b.endDate);
      return a.id - b.id;
    });
    save();
    renderCards();
  }

  function removePlansByIds(ids) {
    if (!ids.length) return;
    clearDeletedPlan();
    const idSet = new Set(ids);
    const entries = plans.map((plan, index) => ({ plan, index })).filter(({ plan }) => idSet.has(plan.id));
    if (!entries.length) return;
    plans = plans.filter(item => !idSet.has(item.id));
    save();
    deleteToastState = {
      entries,
      timer: window.setTimeout(() => {
        clearDeletedPlan();
      }, 4000)
    };
    triggerHaptic('soft');
    showDeleteToast(entries.length === 1 ? entries[0].plan.title : `${entries.length} 个计划`);
  }

  function deleteSelectedPlans() {
    const ids = Array.from(selectedPlanIds);
    if (!ids.length) return;
    removePlansByIds(ids);
    selectionMode = false;
    selectedPlanIds.clear();
    renderMain();
  }

  function endCardDrag(shouldCommit = true) {
    const state = cardDragState;
    if (!state) return;
    document.removeEventListener('pointermove', onCardDragMove);
    document.removeEventListener('pointerup', onCardDragEnd);
    document.removeEventListener('pointercancel', onCardDragEnd);
    state.grid.querySelectorAll('.plan-card.drop-target').forEach(card => card.classList.remove('drop-target'));
    state.placeholder.classList.remove('drag-origin', 'drop-target');
    if (state.ghost.parentNode) state.ghost.remove();
    let nextIndex = state.startIndex;
    if (shouldCommit && state.moved) {
      nextIndex = Array.from(state.grid.querySelectorAll('.plan-card')).indexOf(state.placeholder);
      if (nextIndex !== -1 && nextIndex !== state.startIndex) movePlan(state.startIndex, nextIndex);
    }
    state.placeholder.classList.remove('placeholder');
    cardDragState = null;
    renderCards();
  }

  function onCardDragMove(e) {
    const state = cardDragState;
    if (!state) return;
    const deltaX = e.clientX - state.originX;
    const deltaY = e.clientY - state.originY;
    if (!state.moved && Math.hypot(deltaX, deltaY) > 4) state.moved = true;
    state.ghost.style.left = `${e.clientX - state.offsetX}px`;
    state.ghost.style.top = `${e.clientY - state.offsetY}px`;

    const hovered = document.elementsFromPoint(e.clientX, e.clientY)
      .map(el => el.closest ? el.closest('.plan-card') : null)
      .find(card => card && card !== state.placeholder && !card.classList.contains('drag-ghost'));
    if (!hovered || hovered.parentNode !== state.grid) {
      state.grid.querySelectorAll('.plan-card.drop-target').forEach(card => card.classList.remove('drop-target'));
      return;
    }

    const siblings = Array.from(state.grid.querySelectorAll('.plan-card'));
    const placeholderIndex = siblings.indexOf(state.placeholder);
    const hoveredIndex = siblings.indexOf(hovered);
    if (hoveredIndex === -1 || hoveredIndex === placeholderIndex) return;

     state.grid.querySelectorAll('.plan-card.drop-target').forEach(card => {
      if (card !== hovered) card.classList.remove('drop-target');
    });
    hovered.classList.add('drop-target');

    if (hoveredIndex > placeholderIndex) state.grid.insertBefore(state.placeholder, hovered.nextSibling);
    else state.grid.insertBefore(state.placeholder, hovered);
    triggerHaptic('tick');
  }

  function onCardDragEnd() {
    endCardDrag(true);
  }

  function startCardDrag(e, card, handle) {
    if (selectionMode || cardDragState || e.button > 0) return;
    e.preventDefault();
    e.stopPropagation();
    clearDeletedPlan();
    const grid = document.getElementById('cardGrid');
    if (!grid) return;
    const rect = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = `${rect.width}px`;
    ghost.style.height = `${rect.height}px`;
    ghost.style.left = `${rect.left}px`;
    ghost.style.top = `${rect.top}px`;
    document.body.appendChild(ghost);
    card.classList.add('placeholder', 'drag-origin');
    cardDragState = {
      ghost,
      grid,
      handle,
      placeholder: card,
      startIndex: Array.from(grid.querySelectorAll('.plan-card')).indexOf(card),
      moved: false,
      originX: e.clientX,
      originY: e.clientY,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top
    };
    triggerHaptic('soft');
    document.addEventListener('pointermove', onCardDragMove);
    document.addEventListener('pointerup', onCardDragEnd);
    document.addEventListener('pointercancel', onCardDragEnd);
    handle.setPointerCapture(e.pointerId);
  }

  function renderCards() {
    if (cardDragState) endCardDrag(false);
    const grid = document.getElementById('cardGrid');
    if (plans.length === 0) {
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-state">
            <div class="empty-illustration" aria-hidden="true"><span>✈</span><span>🧳</span><span>📍</span></div>

    grid.innerHTML = plans.map((plan, index) => {
      const days = getDaysArray(plan.startDate, plan.endDate);

      const selected = selectedPlanIds.has(plan.id);
      return `

            <div class="dates">${plan.startDate} → ${plan.endDate}</div>

          </div>

    }).join('');
    grid.querySelectorAll('.plan-card').forEach(card => {
      const id = Number(card.dataset.id);
      const handle = card.querySelector('.plan-handle');
      card.onclick = (e) => {
        if (e.target.closest('.plan-card-action')) return;
        if (selectionMode) {
          togglePlanSelection(id);
          return;
        }
        if (suppressPlanOpenId === id) {
          suppressPlanOpenId = null;
          return;
        }

      if (selectionMode) {
        const selectToggle = card.querySelector('.plan-select-toggle');
        selectToggle.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          togglePlanSelection(id);
        };
        return;
      }

      const exportBtn = card.querySelector('.plan-card-export');

      handle.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
      };
      handle.onpointerdown = (e) => startCardDrag(e, card, handle);
      if (exportBtn) {
        exportBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          exportSinglePlanAsJson(id);
        };
      }

      card.onpointerdown = (e) => {
        if (e.button > 0 || e.target.closest('.plan-card-action')) return;
        clearCardLongPress();
        cardLongPressState = {
          planId: id,
          startX: e.clientX,
          startY: e.clientY,
          timer: window.setTimeout(() => {
            suppressPlanOpenId = id;
            clearCardLongPress();
            enterSelectionMode(id);
          }, CARD_LONG_PRESS_MS)
        };
      };
      card.onpointermove = (e) => {
        if (!cardLongPressState || cardLongPressState.planId !== id) return;
        if (Math.hypot(e.clientX - cardLongPressState.startX, e.clientY - cardLongPressState.startY) > 8) clearCardLongPress();
      };
      card.onpointerup = () => {
        if (cardLongPressState?.planId === id) clearCardLongPress();
      };
      card.onpointercancel = () => {
        if (cardLongPressState?.planId === id) clearCardLongPress();
      };
      card.onpointerleave = () => {
        if (cardLongPressState?.planId === id) clearCardLongPress();
      };
    });
  }

  function downloadTextFile(filename, text, mimeType = 'application/json') {
    const blob = new Blob([text], { type: mimeType });
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(objectUrl), 0);
  }

  function exportPlansAsJson() {
    if (!plans.length) return;
    const payload = buildExportPayload();
    const fileName = `travel-plans-${getTodayDateString()}.json`;
    downloadTextFile(fileName, JSON.stringify(payload, null, 2));
    showEphemeralToast(uiText.toast.exportedPlans, `${payload.planCount} 个计划 · ${fileName}`);
  }

  function getExportFilenameSegment(value, fallback = 'plan') {
    const normalized = String(value || '')
      .trim()
      .normalize('NFKC')
      .replace(/[<>:"/\\|?*\u0000-\u001F]/g, ' ')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-+|-+$/g, '');
    return normalized || fallback;
  }

  function exportSinglePlanAsJson(planId) {
    const plan = getPlan(planId);
    if (!plan) return;
    const payload = buildExportPayload([plan]);
    const fileName = `travel-plan-${getExportFilenameSegment(plan.title, String(plan.id))}-${getTodayDateString()}.json`;
    downloadTextFile(fileName, JSON.stringify(payload, null, 2));
    showEphemeralToast(uiText.toast.exportedPlans, `${plan.title} · ${fileName}`);
  }

    const previewTitleEl = document.getElementById('importPreviewTitle');

    let draftMode = 'merge';

    const syncModeUi = () => {

      if (!draftFileState.valid) {

        fileMetaEl.textContent = '文件已读取，但未通过当前导入校验。';
        previewTitleEl.textContent = '无法导入';
