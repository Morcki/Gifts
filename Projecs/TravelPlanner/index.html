      fileNameEl.textContent = draftFileState.fileName;
      fileMetaEl.textContent = `检测到 ${draftFileState.planCount} 个计划 · 版本 ${draftFileState.version}`;
      previewTitleEl.textContent = `${draftFileState.planCount} 个计划待导入`;
      previewMetaEl.textContent = draftFileState.exportedAt
        ? `导出时间 ${new Date(draftFileState.exportedAt).toLocaleString('zh-CN')}`

      statusEl.textContent = draftMode === 'replace'
        ? `当前本地有 ${plans.length} 个计划，确认导入时将整体替换。`

      if (!draftFileState?.valid) {
        alert(uiText.validation.importNeedsFile);

      }
      if (draftMode === 'replace' && plans.length) {
        const decision = await showActionSheet({
          badge: uiText.badge.danger,
          badgeTone: 'danger',
          title: '替换本地计划？',
          message: `当前共有 ${plans.length} 个本地计划，替换后将仅保留本次导入的 ${draftFileState.planCount} 个计划。`,
          actions: [
            { value: 'replace', label: '确认替换', tone: 'destructive' },
            { value: 'cancel', label: uiText.action.cancel, tone: 'secondary' }
          ]
        });
        if (decision !== 'replace') return;
      }
      const importedPlans = draftFileState.normalizedPlans.map(plan => normalizePlanRecord(plan));
      if (!importedPlans.length) {
        alert(uiText.validation.importNoPlans);
        return;
      }
      plans = draftMode === 'replace' ? importedPlans : [...plans, ...importedPlans];
      save();
      closeModal();
      renderMain();
      showEphemeralToast(uiText.toast.importedPlans, `${importedPlans.length} 个计划 · ${draftMode === 'replace' ? '已替换本地' : '已并入本地'}`);
    };

    fileInput.onchange = async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      const text = await file.text();
      const payload = safeParseJson(text, null);
      const normalizedPlans = normalizeImportedPlans(payload);
      const extracted = extractPlansPayload(payload);
      draftFileState = normalizedPlans.length
        ? {
            valid: true,
            fileName: file.name,
            normalizedPlans,
            planCount: normalizedPlans.length,
            exportedAt: extracted?.meta?.exportedAt || '',
            version: extracted?.meta?.version || 'array'
          }
        : {
            valid: false,
            fileName: file.name,
            reason: payload == null ? uiText.validation.importInvalidFile : uiText.validation.importNoPlans
          };
      syncFileUi();
    };

    document.getElementById('pickImportFileBtn').onclick = () => fileInput.click();
    modal.querySelectorAll('.import-mode-option').forEach(option => {
      option.onclick = () => {
        draftMode = option.dataset.mode || 'merge';
        syncModeUi();
        syncFileUi();
      };
    });
    document.getElementById('confirmImportBtn').onclick = commitImport;
    document.getElementById('cancelImportBtn').onclick = closeModal;
    modal.onclick = (e) => {
      if (e.target !== modal) return;
      closeModal();
    };
    syncModeUi();
    syncFileUi();
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function animateDaySliderTo(slider, targetScrollLeft, duration = 260) {
    stopDaySliderInertia(slider);
    const maxScrollLeft = Math.max(0, slider.scrollWidth - slider.clientWidth);
    const clampedTarget = Math.max(0, Math.min(targetScrollLeft, maxScrollLeft));
    const startScrollLeft = slider.scrollLeft;
    const delta = clampedTarget - startScrollLeft;
    if (Math.abs(delta) < 1) {
      slider.scrollLeft = clampedTarget;
      updateDaySliderMask(slider);
      return;
    }
    const startTime = performance.now();
    const step = (now) => {
      const progress = Math.min(1, (now - startTime) / duration);
      slider.scrollLeft = startScrollLeft + delta * easeOutCubic(progress);
      updateDaySliderMask(slider);
      if (progress < 1) {
        slider._inertiaFrame = requestAnimationFrame(step);
      } else {
        slider._inertiaFrame = null;
      }
    };
    slider._inertiaFrame = requestAnimationFrame(step);
  }

  function centerDayToggle(slider, btn, animated = true) {
    if (!btn) return;
    const targetScrollLeft = btn.offsetLeft - (slider.clientWidth - btn.offsetWidth) / 2;
    if (animated) animateDaySliderTo(slider, targetScrollLeft);
    else {
      slider.scrollLeft = targetScrollLeft;
      updateDaySliderMask(slider);
    }
  }

  function activateDayToggle(slider, btn) {
    if (!btn) return;
    slider.querySelectorAll('.day-toggle').forEach(b => b.classList.remove('active-day'));
    btn.classList.add('active-day');
    const date = btn.dataset.date;
    toggleDay(date);
    centerDayToggle(slider, btn, true);
  }

  function snapDaySliderToNearest(slider) {
    const toggles = Array.from(slider.querySelectorAll('.day-toggle'));
    if (!toggles.length) return;
    const sliderRect = slider.getBoundingClientRect();
    const sliderCenter = sliderRect.left + sliderRect.width / 2;
    let nearest = toggles[0];
    let minDistance = Number.POSITIVE_INFINITY;
    toggles.forEach(toggle => {
      const rect = toggle.getBoundingClientRect();
      const center = rect.left + rect.width / 2;
      const distance = Math.abs(center - sliderCenter);
      if (distance < minDistance) {
        minDistance = distance;
        nearest = toggle;
      }
    });
    centerDayToggle(slider, nearest, true);
  }

  function stopDaySliderInertia(slider) {
    if (slider._inertiaFrame) {
      cancelAnimationFrame(slider._inertiaFrame);
      slider._inertiaFrame = null;
    }
  }

  function startDaySliderInertia(slider, initialVelocity) {
    stopDaySliderInertia(slider);
    if (Math.abs(initialVelocity) < 0.02) {
      updateDaySliderMask(slider);
      snapDaySliderToNearest(slider);
      return;
    }
    let velocity = initialVelocity;
    let lastTime = performance.now();

    const step = (now) => {
      const dt = Math.min(32, Math.max(1, now - lastTime));
      lastTime = now;
      slider.scrollLeft -= velocity * dt;
      updateDaySliderMask(slider);
      velocity *= 0.92;
      if (Math.abs(velocity) < 0.02) {
        slider._inertiaFrame = null;
        snapDaySliderToNearest(slider);
        return;
      }
      slider._inertiaFrame = requestAnimationFrame(step);
    };

    slider._inertiaFrame = requestAnimationFrame(step);
  }

  function attachDaySliderDragScroll(slider) {
    if (!slider || slider.dataset.dragScrollBound === 'true') return;
    slider.dataset.dragScrollBound = 'true';
    let pointerId = null;
    let startX = 0;
    let startScrollLeft = 0;
    let lastX = 0;
    let lastTime = 0;
    let velocity = 0;
    let moved = false;
    const DRAG_THRESHOLD = 6;

    slider.onpointerdown = (e) => {
      if (e.button > 0) return;
      stopDaySliderInertia(slider);
      pointerId = e.pointerId;
      startX = e.clientX;
      startScrollLeft = slider.scrollLeft;
      lastX = e.clientX;
      lastTime = performance.now();
      velocity = 0;
      moved = false;
      slider.classList.remove('dragging-slider');
      slider.setPointerCapture(e.pointerId);
    };

    slider.onpointermove = (e) => {
      if (pointerId !== e.pointerId) return;
      const deltaX = e.clientX - startX;
      if (!moved && Math.abs(deltaX) > DRAG_THRESHOLD) {
        moved = true;
        slider.classList.add('dragging-slider');
      }
      if (!moved) return;
      e.preventDefault();
      slider.scrollLeft = startScrollLeft - deltaX;
      updateDaySliderMask(slider);
      const now = performance.now();
      const dt = Math.max(1, now - lastTime);
      velocity = (e.clientX - lastX) / dt;
      lastX = e.clientX;
      lastTime = now;
    };

    const stopDragging = (e) => {
      if (pointerId == null || (e && pointerId !== e.pointerId)) return;
      if (slider.hasPointerCapture(pointerId)) slider.releasePointerCapture(pointerId);
      if (moved) {
        slider.dataset.suppressClickUntil = String(Date.now() + 220);
        startDaySliderInertia(slider, velocity);
      } else if (e) {
        const hit = document.elementFromPoint(e.clientX, e.clientY)?.closest('.day-toggle');
        if (hit && slider.contains(hit)) {
          slider.dataset.handledTap = 'true';
          window.setTimeout(() => { delete slider.dataset.handledTap; }, 0);
          activateDayToggle(slider, hit);
        }
      }
      slider.classList.remove('dragging-slider');
      pointerId = null;
      moved = false;
      velocity = 0;
    };

    slider.onpointerup = stopDragging;
    slider.onpointercancel = stopDragging;
    slider.onpointerleave = (e) => {
      if (pointerId === e.pointerId && !slider.hasPointerCapture(pointerId)) stopDragging(e);
    };
    slider.onscroll = () => updateDaySliderMask(slider);
    updateDaySliderMask(slider);
  }

  function renderDaySlider(days, plan) {
    const slider = document.getElementById('daySlider');
    slider.innerHTML = days.map(date => {
      const edited = dayEdited(plan, date);
      return `<button class="day-toggle${edited?' edited':''}" data-date="${date}">${date}</button>`;
    }).join('');
    attachDaySliderDragScroll(slider);
    slider.querySelectorAll('.day-toggle').forEach(btn => {
      btn.onclick = () => {
        if (slider.dataset.handledTap === 'true') return;
        if (Number(slider.dataset.suppressClickUntil || 0) > Date.now()) return;
        activateDayToggle(slider, btn);
      };
    });
  }

  function toggleDay(date) {
    const container = document.getElementById('dayDetailContainer');
    if (openDay === date) {
      container.innerHTML = '';
      openDay = null;
      document.querySelectorAll('.day-toggle').forEach(b => b.classList.remove('active-day'));
    } else {

      container.innerHTML = `<div class="day-content open" data-date="${date}"><div><div class="day-content-inner" id="content-${date}"></div></div></div>`;
      renderDayEditor(date, document.getElementById(`content-${date}`));
      document.querySelectorAll('.day-toggle').forEach(b => b.classList.remove('active-day'));
      const activeBtn = document.querySelector(`.day-toggle[data-date="${date}"]`);

  function runUiRefreshStep(label, callback) {
    try {
      callback();
    } catch (error) {
      console.error(`UI refresh failed: ${label}`, error);
    }
  }

  function refreshDayUi(date, options = {}) {
    const settings = {
      planRoute: true,
      updateToggle: true,
      defer: false,
      ...options
    };
    const sections = normalizeDayUiSections(options);
    const run = () => {
      if (sections.has(DAY_UI_SECTION.editor)) {
        runUiRefreshStep('day editor', () => refreshDayEditor(date));
      } else {
        if (sections.has(DAY_UI_SECTION.tagBar)) {
          runUiRefreshStep('day tag bar', () => refreshDayTagBar(date));
        }
        if (sections.has(DAY_UI_SECTION.timelineSection)) {
          runUiRefreshStep('day timeline section', () => refreshDayTimelineSection(date));
        } else if (sections.has(DAY_UI_SECTION.timeline)) {
          runUiRefreshStep('day timeline', () => refreshDayTimeline(date));
        }
        if (sections.has(DAY_UI_SECTION.dayRouteSection)) {
          runUiRefreshStep('day route section', () => refreshDayRouteSection(date));
        } else if (sections.has(DAY_UI_SECTION.dayRoute)) {
          runUiRefreshStep('day route panel', () => refreshDayRoutePanel(date));
        }
      }
      if (settings.planRoute) {
        refreshPlanUi();
      }
      if (settings.updateToggle) {
        runUiRefreshStep('day toggle style', () => updateDayToggleStyle(date));
      }
    };
    if (settings.defer) requestAnimationFrame(run);
    else run();
  }

    if (container) {
      container.innerHTML = '';

  // ========== 日编辑器 ==========
  function renderDayEditor(date, container) {
    const plan = getPlan(currentPlanId);

  function drawActivities(date, timeline) {
    const plan = getPlan(currentPlanId);
    const dayData = plan.days[date];
    timeline.querySelectorAll('.activity-block, .drag-preview').forEach(el => el.remove());
    const hiddenTags = dayData.hiddenTags || [];
    const acts = dayData.activities.map((a, idx) => ({ ...a, origIdx: idx }));
    const colMap = computeActivityLayout(acts);

    acts.forEach(act => {
      if (!colMap[act.origIdx]) colMap[act.origIdx] = { col: 0, span: 1, total: 1 };
      const { col, span, total } = colMap[act.origIdx];
      const tag = dayData.tags.find(t => t.id === act.tagId);
      if (!tag) return;
      const isTransport = isTransportActivity(act);
      const startMin = timeToMin(act.startTime);
      const endMin = timeToMin(act.endTime);
      const heightPct = ((endMin - startMin) / (24*60)) * 100;
      const durationMinutes = getActivityDurationMinutes(act);
      const previewDensity = getActivityPreviewDensity(durationMinutes, heightPct, isTransport);
      const block = document.createElement('div');
      block.className = 'activity-block';
      block.classList.add(`activity-${previewDensity}`);
      if (previewDensity === 'compact' || durationMinutes <= 90) block.classList.add('touch-short-block');
      if (previewDensity === 'compact' || durationMinutes <= 60) block.classList.add('mini-drag-indicator');
      if (isTransport) block.classList.add('transport-block');
      if (hiddenTags.includes(act.tagId)) block.classList.add('disabled');
      setTimelineSpanPosition(block, timeline, startMin, endMin);
      const leftBase = 40;
      const rightBase = 4;
      const rightCols = total - col - span;
      block.style.left = `calc(${leftBase}px + (100% - ${leftBase + rightBase}px) * (${col} / ${total}))`;
      block.style.right = `calc(${rightBase}px + (100% - ${leftBase + rightBase}px) * (${rightCols} / ${total}))`;
      block.style.background = tag.color;
      block.style.zIndex = String(10 + col + span);
      const displayTitle = escapeHtml(getActivityDisplayTitle(act));
      const displayMeta = isTransport
        ? `${escapeHtml(String(act.startLocation || '起点').trim())} → ${escapeHtml(String(act.endLocation || '终点').trim())}`
        : escapeHtml(String(act.location || '').trim());
      const durationLabel = formatDurationHours(durationMinutes);
      const compactTimeLabel = getCompactActivityTimeLabel(act);
      const transportMeta = getTransportMeta(getTransportMode(act, 'drive'));
      const notePreview = escapeHtml(getActivityPreviewNote(act));
      block.dataset.index = act.origIdx;
      if (isTransport) block.classList.add(`transport-${previewDensity}`);
      block.innerHTML = isTransport
        ? `<div class="activity-content transport-content"><div class="activity-main-row"><span class="activity-kicker">移动</span><span class="activity-time">${compactTimeLabel}</span><span class="activity-meta transport-route">${displayMeta}</span><span class="activity-duration transport-duration">${transportMeta.icon}${transportMeta.name}</span></div></div><div class="drag-handle drag-top"></div><div class="drag-handle drag-bottom"></div><div class="drag-handle drag-body"></div><div class="drag-side-indicator" aria-hidden="true"><span class="drag-side-primary"></span><span class="drag-side-secondary"></span></div>`
        : `<div class="activity-content"><div class="activity-main-row"><span class="activity-title">${displayTitle}</span><span class="activity-time">${compactTimeLabel}</span>${displayMeta ? `<span class=\"activity-meta\">${displayMeta}</span>` : ''}</div>${notePreview ? `<div class="activity-note">${notePreview}</div>` : ''}</div><div class="drag-handle drag-top"></div><div class="drag-handle drag-bottom"></div><div class="drag-handle drag-body"></div><div class="drag-side-indicator" aria-hidden="true"><span class="drag-side-primary"></span><span class="drag-side-secondary"></span></div>`;
      timeline.appendChild(block);
      attachBlockEvents(block, date, act.origIdx);
    });
  }

  function attachBlockEvents(block, date, index) {
    const plan = getPlan(currentPlanId);
    const dayData = plan.days[date];
    const DRAG_ARM_DELAY_MS = 80;
    const SHORT_BLOCK_EDGE_ZONE_MIN = 22;
    const SHORT_BLOCK_EDGE_ZONE_MAX = 34;
    let dragType = null;
    let startY = 0, origStart, origEnd;
    let moved = false;
    let activePointerId = null;
    let dragThreshold = 3;
    let previewStartMin = 0;
    let previewEndMin = 0;
    let dragArmTimer = null;
    const dragSnapHaptic = { value: null };
    const timeline = document.getElementById(`timeline-${date}`);
    const indicator = document.getElementById(`indicator-${date}`);
    const blockDragIndicator = block.querySelector('.drag-side-indicator');

    const clearDragVisualState = () => {
      block.classList.remove('drag-pressing', 'drag-armed', 'edge-hint-top', 'edge-hint-bottom', 'resizing-top', 'resizing-bottom', 'dragging');
    };

    const clearDragArmTimer = () => {
      if (!dragArmTimer) return;
      clearTimeout(dragArmTimer);
      dragArmTimer = null;
    };

    const armDragPreview = () => {
      if (moved) return;
      block.classList.add('drag-armed');
    };

    const isTouchPointer = (event) => event.pointerType === 'touch' || event.pointerType === 'pen';

    const getShortBlockEdgeIntent = (event) => {
      if (!isTouchPointer(event) || !block.classList.contains('touch-short-block')) return null;
      const rect = block.getBoundingClientRect();
      if (!rect.height) return null;
      const edgeZone = Math.min(SHORT_BLOCK_EDGE_ZONE_MAX, Math.max(SHORT_BLOCK_EDGE_ZONE_MIN, rect.height * 0.34));
      const localY = event.clientY - rect.top;
      if (localY <= edgeZone) return 'top';
      if (localY >= rect.height - edgeZone) return 'bottom';
      return null;
    };

    const applyPreDragVisualState = (event) => {
      clearDragVisualState();
      clearDragArmTimer();
      if (dragType === 'move') {
        block.classList.add('drag-pressing');
        if (isTouchPointer(event)) {
          dragArmTimer = window.setTimeout(armDragPreview, DRAG_ARM_DELAY_MS);
        }
      } else if (dragType === 'top') {
        block.classList.add('edge-hint-top');
      } else if (dragType === 'bottom') {
        block.classList.add('edge-hint-bottom');
      }
    };

    const refreshTransportDurationPreview = (startMin, endMin) => {
      const act = dayData.activities[index];
      if (!isTransportActivity(act)) return;
      const durationEl = block.querySelector('.transport-duration');
      if (!durationEl) return;
      const transportMeta = getTransportMeta(getTransportMode(act, 'drive'));
      durationEl.textContent = `${transportMeta.icon} ${transportMeta.name} · ${formatDurationHours(Math.max(0, endMin - startMin))}`;
    };

    const updateBlockDragIndicator = (startMin, endMin) => {
      if (!blockDragIndicator) return;
      const primary = blockDragIndicator.querySelector('.drag-side-primary');
      const secondary = blockDragIndicator.querySelector('.drag-side-secondary');
      const snappedStart = snapMinutesToQuarter(startMin);
      const snappedEnd = snapMinutesToQuarter(endMin);
      // 优化时间段格式，避免内容过长
      primary.textContent = `${minToTime(snappedStart)}-${minToTime(snappedEnd)}`;
      secondary.textContent = formatDurationHours(Math.max(15, snappedEnd - snappedStart));
    };

    const hideBlockDragIndicator = () => {
      if (!blockDragIndicator) return;
      const primary = blockDragIndicator.querySelector('.drag-side-primary');
      const secondary = blockDragIndicator.querySelector('.drag-side-secondary');
      primary.textContent = '';
      secondary.textContent = '';
    };

    const onPointerDown = (e) => {
      if (activePointerId != null && activePointerId !== e.pointerId) return;
      const target = e.target;
      const shortBlockEdgeIntent = getShortBlockEdgeIntent(e);
      if (target.closest('.drag-top')) dragType = 'top';
      else if (target.closest('.drag-bottom')) dragType = 'bottom';
      else if (shortBlockEdgeIntent) dragType = shortBlockEdgeIntent;
      else if (target.closest('.drag-body')) dragType = 'move';
      else if (!isTouchPointer(e) && (target === block || target.closest('.activity-content'))) dragType = 'move';
      else return;
      e.preventDefault();
      e.stopPropagation();
      const act = dayData.activities[index];
      origStart = act.startTime;
      origEnd = act.endTime;
      previewStartMin = timeToMin(origStart);
      previewEndMin = timeToMin(origEnd);
      startY = e.clientY;
      moved = false;
      activePointerId = e.pointerId;
      dragThreshold = dragType === 'move'
        ? getPointerDragThreshold(e, 4, 8)
        : getPointerDragThreshold(e, 4, 6);
      dragSnapHaptic.value = dragType === 'bottom' ? previewEndMin : previewStartMin;
      applyPreDragVisualState(e);
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
      document.addEventListener('pointercancel', onPointerUp);
      block.setPointerCapture(e.pointerId);
    };

    const onPointerMove = (e) => {
      if (activePointerId !== e.pointerId) return;
      if (Math.abs(e.clientY - startY) > dragThreshold && !moved) {
        moved = true;
        snapshotDate(date);
        clearDragArmTimer();
        clearDragVisualState();
        if (dragType === 'top') {
          block.classList.add('resizing-top', 'drag-armed', 'dragging');
        } else if (dragType === 'bottom') {
          block.classList.add('resizing-bottom', 'drag-armed', 'dragging');
        } else {
          block.classList.add('drag-armed', 'dragging');
        }
        triggerHaptic('soft');
      }
      if (!moved) return;
      e.preventDefault();
      const { usableHeight } = getTimelineMetrics(timeline);
      const pxPerMin = usableHeight / (24 * 60);
      const deltaMin = (e.clientY - startY) / pxPerMin;
      const startMin = timeToMin(origStart);
      const endMin = timeToMin(origEnd);
      hideTimeIndicator(indicator);

      if (dragType === 'top') {
        let newStart = clampTime(startMin + deltaMin);
        if (newStart >= endMin - 15) newStart = endMin - 15;
        previewStartMin = newStart;
        previewEndMin = endMin;
        setTimelineSpanPosition(block, timeline, newStart, endMin);
        refreshTransportDurationPreview(newStart, endMin);
        updateSnapHapticState(dragSnapHaptic, newStart);
        updateBlockDragIndicator(newStart, endMin);
      } else if (dragType === 'bottom') {
        let newEnd = clampTime(endMin + deltaMin);
        if (newEnd <= startMin + 15) newEnd = startMin + 15;
        previewStartMin = startMin;
        previewEndMin = newEnd;
        setTimelineSpanPosition(block, timeline, startMin, newEnd);
        refreshTransportDurationPreview(startMin, newEnd);
        updateSnapHapticState(dragSnapHaptic, newEnd);
        updateBlockDragIndicator(startMin, newEnd);
      } else if (dragType === 'move') {
        const duration = endMin - startMin;
        let newStart = clampTime(Math.min(startMin + deltaMin, 24 * 60 - duration));
        previewStartMin = newStart;
        previewEndMin = newStart + duration;
        setTimelineSpanPosition(block, timeline, newStart, newStart + duration);
        refreshTransportDurationPreview(newStart, newStart + duration);
        updateSnapHapticState(dragSnapHaptic, newStart);
        updateBlockDragIndicator(newStart, newStart + duration);
      }
    };

    const onPointerUp = (e) => {
      if (activePointerId != null && e?.pointerId != null && activePointerId !== e.pointerId) return;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
      document.removeEventListener('pointercancel', onPointerUp);
      clearDragArmTimer();
      clearDragVisualState();
      hideTimeIndicator(indicator);
      hideBlockDragIndicator();
      if (activePointerId != null && block.hasPointerCapture(activePointerId)) {
        block.releasePointerCapture(activePointerId);
      }
      if (e?.type === 'pointercancel') {
        activePointerId = null;
        dragType = null;
        dragSnapHaptic.value = null;
        return;
      }
      if (moved) {
        block.dataset.suppressClickUntil = String(Date.now() + 260);
        const act = dayData.activities[index];
        const snappedStartMin = snapMinutesToQuarter(previewStartMin);
        const snappedEndMin = snapMinutesToQuarter(previewEndMin);
        const nextRange = dragType === 'move'
          ? clampActivityRange(snappedStartMin, snappedStartMin + (timeToMin(origEnd) - timeToMin(origStart)))
          : clampActivityRange(snappedStartMin, snappedEndMin);
        act.startTime = minToTime(nextRange.startMin);
        act.endTime = minToTime(nextRange.endMin);
        save();
        refreshDayUi(date, {
          sections: [DAY_UI_SECTION.timeline, DAY_UI_SECTION.dayRoute],
          planRoute: true
        });
      }
      activePointerId = null;
      dragType = null;
      dragSnapHaptic.value = null;
    };

    const onClick = (e) => {
      if (Number(block.dataset.suppressClickUntil || 0) > Date.now()) return;
      if (e.target.closest('.drag-handle')) return;
      editActivity(date, index);
    };

    function showTimeIndicator(ind, minutes, rangeStart = minutes, rangeEnd = minutes) {
      const rangeStartMin = Math.min(rangeStart, rangeEnd);
      const rangeEndMin = Math.max(rangeStart, rangeEnd);
      const snappedStart = snapMinutesToQuarter(rangeStartMin);
      const snappedEnd = snapMinutesToQuarter(rangeEndMin);
      const label = ind.querySelector('.time-indicator-text');
      ind.style.top = `${timelineMinutesToOffset(timeline, minutes)}px`;
      if (snappedStart !== snappedEnd) {
        label.classList.add('range-mode');
        label.innerHTML = `<span class="time-indicator-primary">${minToTime(snappedStart)} → ${minToTime(snappedEnd)}</span><span class="time-indicator-secondary">${formatDurationHours(Math.max(15, snappedEnd - snappedStart))}</span>`;
      } else {
        label.classList.remove('range-mode');
        label.textContent = minToTime(minutes);
      }
      ind.style.display = 'flex';
    }
    function hideTimeIndicator(ind) {
      const label = ind.querySelector('.time-indicator-text');
      label.classList.remove('range-mode');
      label.textContent = '';
      ind.style.display = 'none';
    }

    block.addEventListener('pointerdown', onPointerDown);
    block.addEventListener('click', onClick);
  }

  function editActivity(date, index) {
    snapshotDate(date);
    openActivityModal(date, undefined, index);
  }

  function updateOverlayScrollLock() {
    document.body.classList.toggle('overlay-locked', Boolean(uiLayerState.modal || uiLayerState.sheet));
  }

  function removeActiveModal() {
    const modal = uiLayerState.modal || document.getElementById('modal');

    window.setTimeout(() => {
      if (modal.parentNode) modal.remove();
      if (uiLayerState.modal === modal) uiLayerState.modal = null;
      updateOverlayScrollLock();

  function openActivityModal(date, startTime = '08:00', editIndex = null, endTime = null) {
    const plan = getPlan(currentPlanId);
    const dayData = plan.days[date];
    const act = editIndex != null ? dayData.activities[editIndex] : null;
    const tags = dayData.tags;
    const hiddenTags = dayData.hiddenTags || [];
    const effectiveStartTime = act ? act.startTime : startTime;
    const defaultEnd = act ? act.endTime : (endTime || addHour(effectiveStartTime));
    const currentTagId = act ? act.tagId : 'undecided';
    const modalHtml = `
      <div class="modal-overlay" id="modal"><div class="modal activity-edit-modal" role="dialog" aria-modal="true" aria-label="${act ? '编辑活动' : '添加活动'}">
        <div class="modal-header">
          <h3>${act ? '编辑活动' : '添加活动'}</h3>
        </div>

    const endLocationInput = document.getElementById('actEndLocation');
    const transportInput = document.getElementById('actTransport');
    const descInput = document.getElementById('actDesc');
    const locationGroup = document.getElementById('locationGroup');
    const startLocationGroup = document.getElementById('startLocationGroup');
    const endLocationGroup = document.getElementById('endLocationGroup');
    const transportGroup = document.getElementById('transportGroup');
    const transportQuickModeGroup = document.getElementById('transportQuickModeGroup');
    const transportQuickEditGroup = document.getElementById('transportQuickEditGroup');

    const transportDurationButtons = Array.from(document.querySelectorAll('#transportDurationQuickRow .quick-chip'));
    const collectDraft = () => ({
      startTime: startTimeInput.value,
      endTime: endTimeInput.value,
      title: titleInput.value.trim(),
      location: locationInput.value.trim(),
      startLocation: startLocationInput.value.trim(),
      endLocation: endLocationInput.value.trim(),
      transportMode: transportInput.value,
      description: descInput.value,
      tagId: tagSelect.value
    });
    const initialDraft = JSON.stringify({
      startTime: act ? act.startTime : startTime,
      endTime: act ? act.endTime : defaultEnd,
      title: act ? String(act.title || '').trim() : '',
      location: act ? String(act.location || '').trim() : '',
      startLocation: act ? String(act.startLocation || '').trim() : '',
      endLocation: act ? String(act.endLocation || '').trim() : '',
      transportMode: getTransportMode(act, 'drive'),
      description: act ? String(act.description || '') : '',
      tagId: currentTagId
    });
    const isDirty = () => JSON.stringify(collectDraft()) !== initialDraft;
    const syncTransportQuickState = () => {
      const currentMode = transportInput.value;
      const duration = Math.max(15, timeToMin(endTimeInput.value) - timeToMin(startTimeInput.value));
      transportQuickModeButtons.forEach(button => {
        button.classList.toggle('active', button.dataset.mode === currentMode);
      });
      transportDurationButtons.forEach(button => {
        button.classList.toggle('active', Number(button.dataset.duration) === duration);
      });
    };
    const syncTransportDraftTitle = (previousStart, previousEnd) => {
      const nextStart = startLocationInput.value.trim();
      const nextEnd = endLocationInput.value.trim();
      const previousDefault = `${previousStart} → ${previousEnd}`;
      const nextDefault = `${nextStart} → ${nextEnd}`;
      if (!titleInput.value.trim() || titleInput.value.trim() === previousDefault) {
        titleInput.value = nextDefault;
      }
    };
    const commitActivity = () => {
      const selectedTagId = tagSelect.value;
      const isTransport = isTransportTagId(selectedTagId);
      let title = titleInput.value.trim();
      const location = locationInput.value.trim();
      const startLocation = startLocationInput.value.trim();
      const endLocation = endLocationInput.value.trim();
      const transportMode = transportInput.value;
      const start = startTimeInput.value;
      const end = endTimeInput.value;
      if (timeToMin(start) >= timeToMin(end)) { alert(uiText.validation.activityEndAfterStart); return false; }
      if (isTransport) {
        if (!startLocation || !endLocation) { alert(uiText.validation.transportNeedsEndpoints); return false; }
        if (!transportMode) { alert(uiText.validation.transportNeedsMode); return false; }
        if (!title) title = `${startLocation} → ${endLocation}`;
      } else if (!title) {
        title = '无名称';
      }
      const data = {
        id: act ? act.id : Date.now(),
        startTime: start,
        endTime: end,
        title,
        location: isTransport ? '' : location,
        startLocation: isTransport ? startLocation : '',
        endLocation: isTransport ? endLocation : '',
        transportMode: isTransport ? transportMode : '',
        description: descInput.value,
        tagId: selectedTagId
      };
      if (act) dayData.activities[editIndex] = data; else dayData.activities.push(data);
      save();
      closeModal();
      showEphemeralToast(act ? uiText.toast.savedActivity : uiText.toast.addedActivity, `${title} · ${start} - ${end}`);
      refreshDayStructure(date, { defer: true });
      return true;
    };
    const requestCloseWithSavePrompt = async () => {
      if (!isDirty()) {
        closeModal();
        return;
      }
      const decision = await showActionSheet({
        badge: uiText.badge.dirty,
        badgeTone: 'info',
        title: uiText.confirm.exitEdit.title,
        message: uiText.confirm.exitEdit.message,
        actions: [
          { value: 'save', label: uiText.action.saveBack, tone: 'primary' },
          { value: 'discard', label: uiText.action.discard, tone: 'destructive' },
          { value: 'stay', label: uiText.action.stay, tone: 'secondary' }
        ]
      });
      if (decision === 'save') {
        commitActivity();
        return;
      }
      if (decision === 'discard') closeModal();
    };
    const syncTransportFields = () => {
      const isTransport = isTransportTagId(tagSelect.value);
      locationGroup.style.display = isTransport ? 'none' : 'block';
      startLocationGroup.style.display = isTransport ? 'block' : 'none';
      endLocationGroup.style.display = isTransport ? 'block' : 'none';
      transportGroup.style.display = isTransport ? 'block' : 'none';
      transportQuickModeGroup.style.display = isTransport ? 'block' : 'none';
      transportQuickEditGroup.style.display = isTransport ? 'block' : 'none';
      transportDurationQuickGroup.style.display = isTransport ? 'block' : 'none';
      titleInput.placeholder = isTransport ? '例如：上海 → 苏州' : '无名称';
      syncTransportQuickState();
    };
    syncTransportFields();
    tagSelect.onchange = syncTransportFields;
    transportInput.onchange = syncTransportQuickState;
    startTimeInput.onchange = syncTransportQuickState;
    endTimeInput.onchange = syncTransportQuickState;
    transportQuickModeButtons.forEach(button => {
      button.onclick = () => {
        transportInput.value = button.dataset.mode;
        syncTransportQuickState();
      };
    });
    transportDurationButtons.forEach(button => {
      button.onclick = () => {
        const duration = Number(button.dataset.duration || 15);
        const startMinutes = timeToMin(startTimeInput.value);
        const nextEnd = clampTime(startMinutes + duration);
        endTimeInput.value = minToTime(nextEnd > startMinutes ? nextEnd : startMinutes + 15);
        syncTransportQuickState();
      };
    });
    swapTransportPointsBtn.onclick = () => {
      const previousStart = startLocationInput.value.trim();
      const previousEnd = endLocationInput.value.trim();
      startLocationInput.value = previousEnd;
      endLocationInput.value = previousStart;
      syncTransportDraftTitle(previousStart, previousEnd);
    };
    modalOverlay.onclick = (e) => {
      if (e.target !== modalOverlay) return;
      requestCloseWithSavePrompt();
    };
    document.getElementById('cancelBtn').onclick = requestCloseWithSavePrompt;
    document.getElementById('saveBtn').onclick = commitActivity;
    if (act) {
      document.getElementById('deleteBtn').onclick = async () => {
        const decision = await showActionSheet({
          badge: uiText.badge.danger,
          badgeTone: 'danger',
          title: uiText.confirm.deleteActivity.title,
          message: uiText.confirm.deleteActivity.message,
          actions: [
            { value: 'delete', label: uiText.action.deleteActivity, tone: 'destructive' },
            { value: 'cancel', label: uiText.action.cancel, tone: 'secondary' }
          ]
        });
        if (decision !== 'delete') return;
        dayData.activities.splice(editIndex, 1);
        save();
        closeModal();
        showEphemeralToast(uiText.toast.deletedActivity, `${act.title || '未命名活动'} · ${act.startTime} - ${act.endTime}`);
        refreshDayStructure(date, { defer: true });
      };
    }
  }

  function toggleTagVisibility(date, tagId) {
    const plan = getPlan(currentPlanId);
    const dayData = plan.days[date];
    if (!dayData.hiddenTags) dayData.hiddenTags = [];
    const idx = dayData.hiddenTags.indexOf(tagId);
    if (idx >= 0) dayData.hiddenTags.splice(idx,1); else dayData.hiddenTags.push(tagId);
    save();
    snapshotDate(date);
    refreshDayTagBarAndTimeline(date);
  }

  async function deleteTag(date, tagId) {
    const dayData = getPlan(currentPlanId).days[date];
    const tag = dayData.tags.find(t => t.id === tagId);
    if (!tag || tag.deletable === false) return;
    const affectsRouteDisplay = doesTagAffectRouteDisplay(dayData, tagId);
    const decision = await showActionSheet({
      badge: uiText.badge.danger,
      badgeTone: 'danger',
      title: uiText.confirm.deleteTag.title,
      message: uiText.confirm.deleteTag.message,
      actions: [
        { value: 'delete', label: uiText.action.deleteTag, tone: 'destructive' },
        { value: 'cancel', label: uiText.action.cancel, tone: 'secondary' }
      ]
    });
    if (decision !== 'delete') return;
    dayData.tags = dayData.tags.filter(t => t.id !== tagId);
    if (dayData.hiddenTags) dayData.hiddenTags = dayData.hiddenTags.filter(id => id !== tagId);
    const affectsTimeline = dayData.activities.some(activity => activity?.tagId === tagId);
    save();
    showEphemeralToast(uiText.toast.deletedTag, tag.name);
    snapshotDate(date);
    refreshDayUi(date, {
      sections: [
        DAY_UI_SECTION.tagBar,
        ...(affectsTimeline ? [DAY_UI_SECTION.timeline] : []),
        ...(affectsRouteDisplay ? [DAY_UI_SECTION.dayRouteSection] : [])
      ],
      planRoute: affectsRouteDisplay,
      updateToggle: false
    });
  }

  function showAddTagModal(date) {
    const presetColors = ['#FF9500', '#FF6B6B', '#FFD93D', '#4ECDC4', '#0EA5E9', '#6366F1', '#8B5CF6', '#EC4899', '#22C55E', '#64748B'];
    const defaultColor = '#FF9500';
    const html = `<div class="modal-overlay" id="modal"><div class="modal" role="dialog" aria-modal="true" aria-label="新建标签"><div class="modal-header"><h3>新建标签</h3></div><div class="modal-body"><div class="field-group"><label>名称</label><input type="text" class="modern-input" id="tagName" placeholder="标签名称"></div><div class="tag-preview-card"><div class="tag-preview-copy"><div class="tag-preview-title">标签预览</div><div class="tag-preview-meta">先选一个接近的预设色，再按需微调自定义颜色。</div></div><div class="tag-preview-chip" id="tagPreviewChip" style="background:${defaultColor};"><span class="tag-preview-dot"></span><span id="tagPreviewText">新标签</span></div></div><div class="field-group"><label>颜色方案</label><div class="tag-color-grid" id="tagColorGrid">${presetColors.map(color => `<button class="tag-color-option${color === defaultColor ? ' active' : ''}" type="button" data-color="${color}" aria-label="选择颜色 ${color}"><span class="tag-color-swatch" style="background:${color};"></span></button>`).join('')}</div><div class="tag-color-custom"><div class="tag-color-picker-shell" style="background:${defaultColor};"><input type="color" id="tagColor" value="${defaultColor}" aria-label="自定义标签颜色"></div><div class="tag-color-picker-copy"><div class="tag-color-picker-title">自定义颜色</div><div class="tag-color-picker-meta">支持系统色板，适合挑选更细的颜色层次。</div><input type="text" class="modern-input tag-color-hex" id="tagColorHex" value="${defaultColor}" spellcheck="false" maxlength="7" placeholder="#FF9500"></div></div></div></div><div class="modal-footer"><button class="btn" id="saveTag">创建</button><button class="btn secondary" id="cancelTag">取消</button></div></div></div>`;

    const colorButtons = Array.from(modal.querySelectorAll('.tag-color-option'));
    const normalizeHexColor = (value) => {
      const raw = String(value || '').trim().toUpperCase();
      return /^#([0-9A-F]{6})$/.test(raw) ? raw : null;
    };
    const syncColorUi = (nextColor) => {
      colorInput.value = nextColor;
      colorHexInput.value = nextColor.toUpperCase();

      colorPickerShell.style.background = nextColor;

    const collectDraft = () => ({
      name: nameInput.value.trim(),
      color: colorInput.value
    });
    const initialDraft = JSON.stringify({ name: '', color: defaultColor });
    const isDirty = () => JSON.stringify(collectDraft()) !== initialDraft;
    const commitTag = () => {
      const name = nameInput.value.trim();
      if (!name) return false;
      getPlan(currentPlanId).days[date].tags.push({ id: 'tag_' + Date.now(), name, icon: '', color: colorInput.value, deletable: true });

      snapshotDate(date);

    colorHexInput.addEventListener('input', () => {
      const normalized = normalizeHexColor(colorHexInput.value);

    syncColorUi(defaultColor);

      if (!isDirty()) {
        closeModal();

      const end = endInput.value;
      if (!start || !end) { alert(uiText.validation.planNeedsDates); return false; }
      if (new Date(start) > new Date(end)) { alert(uiText.validation.planEndAfterStart); return false; }
      const plan = { id: generateId(), title, startDate: start, endDate: end, days: {} };
      plans.push(plan);
      initDays(plan);
      save();
      closeModal();
      showEphemeralToast(uiText.toast.createdPlan, `${title} · ${getTripSummaryText(start, end)}`);
      renderMain();
      return true;
    };
    const requestClose = async () => {
      if (!isDirty()) {
        closeModal();
        return;
      }
      const decision = await showActionSheet({
        badge: uiText.badge.dirty,
        badgeTone: 'info',
        title: uiText.confirm.exitPlanCreate.title,
        message: uiText.confirm.exitPlanCreate.message,
        actions: [
          { value: 'save', label: uiText.action.createBack, tone: 'primary' },
          { value: 'discard', label: uiText.action.discard, tone: 'destructive' },
          { value: 'stay', label: uiText.action.stay, tone: 'secondary' }
        ]
      });
      if (decision === 'save') {
        commitPlan();
        return;
      }
      if (decision === 'discard') closeModal();
    };
    modal.onclick = (e) => {
      if (e.target !== modal) return;
      requestClose();
    };
    document.getElementById('importFromCreateBtn').onclick = requestImport;
    document.getElementById('cancelPlan').onclick = requestClose;
    document.getElementById('savePlan').onclick = commitPlan;
    syncPlanRangeUi();
  }

  function addHour(t) { let [h,m]=t.split(':').map(Number); h=(h+1)%24; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

  load();
  renderMain();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
