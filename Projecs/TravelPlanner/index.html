<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>旅行规划</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅行规划">
  <link rel="apple-touch-icon" href="./icon.png">
  <style>
    :root {
      --blue: #007AFF;
      --green: #34C759;
      --red: #FF3B30;
      --bg: #F2F2F7;
      --card-bg: rgba(255,255,255,0.72);
      --shadow: 0 2px 12px rgba(0,0,0,0.04);
      --radius: 20px;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background: var(--bg); color: #000;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body.overlay-locked {
      overflow: hidden;
    }
    .app { max-width: 600px; margin: 0 auto; padding: 24px 16px 50px; }
    .app.selection-active { padding-bottom: 124px; }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      background: rgba(242,242,247,0.8); border-radius: 28px;
      padding: 16px 24px; margin-bottom: 24px;
      position: sticky; top: 12px; z-index: 10;
    }
    .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.3px; }
    .header-main { display: flex; flex-direction: column; gap: 4px; }
    .header-subtitle { font-size: 13px; color: #6b7280; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; flex: 0 0 36px;
      border: 1px solid rgba(15,23,42,0.06); border-radius: 18px;
      background: rgba(255,255,255,0.44); color: #6B7280;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
      font-size: 18px; line-height: 1; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .icon-btn:active {
      transform: scale(0.96);
      background: rgba(255,255,255,0.68);
      color: #4B5563;
      border-color: rgba(15,23,42,0.10);
    }
    .tool-dock {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }
    .tool-card {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 14px 16px; border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,0.86), rgba(241,245,255,0.76));
      border: 1px solid rgba(148,163,184,0.12);
      box-shadow: 0 14px 32px rgba(15,23,42,0.06);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .tool-card-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .tool-card-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 700; color: #111827;
    }
    .tool-card-title::before {
      content: 'JSON';
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 42px; height: 24px; padding: 0 8px;
      border-radius: 999px; background: rgba(10,132,255,0.12); color: #075985;
      font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
    }
    .tool-card-subtitle { font-size: 12px; color: #6B7280; line-height: 1.45; }
    .tool-card-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .tool-btn {
      border: none; min-height: 38px; padding: 0 14px; border-radius: 16px;
      background: rgba(15,23,42,0.06); color: #111827; font: inherit; font-size: 13px; font-weight: 650;
      cursor: pointer; transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }
    .tool-btn.primary {
      background: linear-gradient(180deg, rgba(10,132,255,0.96), rgba(0,122,255,0.92));
      color: #fff; box-shadow: 0 12px 24px rgba(0,122,255,0.22);
    }
    .tool-btn:active { transform: scale(0.97); }
    .tool-btn:disabled { opacity: 0.44; cursor: default; box-shadow: none; }
    .selection-header {
      gap: 12px;
      padding: 14px 18px;
    }
    .selection-header .header-actions { flex: 1; justify-content: space-between; width: 100%; }
    .selection-count {
      font-size: 16px; font-weight: 650; color: #111827; text-align: center; flex: 1;
    }

    .btn {
      background: var(--blue); color: white; border: none;
      padding: 10px 22px; border-radius: 24px; font-size: 15px;
      font-weight: 590; cursor: pointer; transition: all 0.15s ease;
      box-shadow: 0 4px 12px rgba(0,122,255,0.3);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:active { transform: scale(0.96); background: #0062cc; }
    .btn.secondary {
      background: rgba(120,120,128,0.12); color: #000; box-shadow: none;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .btn.secondary:active { background: rgba(120,120,128,0.2); }
    .header-quiet-btn {
      background: rgba(255,255,255,0.42) !important;
      color: #6B7280 !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45) !important;
      border: 1px solid rgba(15,23,42,0.05);
      padding: 9px 16px;
      font-weight: 560;
    }
    .header-quiet-btn:active {
      background: rgba(255,255,255,0.62) !important;
      color: #4B5563 !important;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      align-items: start;
    }
    .plan-card {
      background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.2s ease;
      cursor: pointer; position: relative; min-height: 148px;
    }
    .plan-card:active { transform: scale(0.98); background: rgba(255,255,255,0.65); }
    .plan-card.selectable { transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.2s ease, border-color 0.2s ease; }
    .plan-card.selected {
      box-shadow: 0 0 0 2px rgba(0,122,255,0.22), 0 14px 28px rgba(0,122,255,0.10);
      background: rgba(255,255,255,0.88);
    }
    .plan-card-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .plan-card-meta {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; color: #8E8E93;
    }
    .plan-card-export {
      min-height: 28px; padding: 0 10px; border-radius: 14px;
      background: rgba(10,132,255,0.10); color: #075985;
      font-size: 12px; font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(10,132,255,0.08);
    }
    .plan-card-body { display: flex; flex-direction: column; min-height: 92px; }
    .plan-card .title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .plan-card .dates { font-size: 13px; color: #666; margin-bottom: 8px; }
    .plan-card .progress {
      font-size: 12px; color: var(--green); background: rgba(52,199,89,0.12);
      padding: 3px 12px; border-radius: 14px; display: inline-block;
    }
    .plan-card-hint { margin-top: auto; padding-top: 12px; font-size: 12px; color: #8E8E93; }
    .plan-card-action {
      border: none; display: inline-flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
    }
    .plan-card-action:active { transform: scale(0.94); }
    .plan-handle {
      width: 34px; height: 34px; border-radius: 17px; background: rgba(120,120,128,0.12);
      color: #636366; font-size: 18px; touch-action: none;
    }
    .plan-handle::before { content: '⋮⋮'; letter-spacing: -2px; transform: translateY(-1px); }
    .plan-select-toggle {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.72);
      color: transparent; font-size: 14px; font-weight: 700;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }
    .plan-select-toggle.selected {
      background: var(--blue); border-color: var(--blue); color: white;
      box-shadow: 0 8px 18px rgba(0,122,255,0.22);
    }
    .plan-select-toggle.selected::before { content: '✓'; }
    .plan-select-toggle::before { content: ''; }
    .plan-card-selection-copy {
      font-size: 12px; color: #6B7280; font-weight: 500;
    }
    .plan-card.placeholder {
      background: rgba(255,255,255,0.34); box-shadow: inset 0 0 0 1.5px rgba(0,122,255,0.18);
      animation: placeholderPulse 1.2s ease-in-out infinite;
    }
    .plan-card.placeholder > * { opacity: 0; }
    .plan-card.drop-target {
      box-shadow: 0 0 0 2px rgba(0,122,255,0.14), 0 12px 24px rgba(0,122,255,0.10);
      transform: scale(0.985);
    }
    .plan-card.drag-ghost {
      position: fixed; margin: 0; z-index: 160; pointer-events: none;
      box-shadow: 0 24px 48px rgba(15,23,42,0.18);
      transform: scale(1.02) rotate(-1.2deg);
      background: rgba(255,255,255,0.92);
    }
    .plan-card.drag-origin .plan-handle {
      background: rgba(0,122,255,0.12); color: var(--blue);
    }
    .selection-toolbar {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(92vw, 520px); padding: 10px; border-radius: 28px;
      background: rgba(255,255,255,0.82); z-index: 220;
      display: flex; align-items: center; gap: 8px; justify-content: space-between;
      box-shadow: 0 22px 48px rgba(15,23,42,0.16);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    }
    .selection-action {
      flex: 1; border: none; background: rgba(120,120,128,0.10); color: #111827;
      padding: 12px 10px; border-radius: 20px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }
    .selection-action:active { transform: scale(0.97); }
    .selection-action.destructive { background: rgba(255,59,48,0.12); color: var(--red); }
    .selection-action:disabled { opacity: 0.45; cursor: default; }
    .toast {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(24px);
      width: min(92vw, 420px); padding: 14px 16px; border-radius: 22px;
      background: rgba(28,28,30,0.88); color: white; z-index: 260;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.24);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .toast.visible {
      opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0);
    }
    .toast-copy { display: flex; flex-direction: column; gap: 2px; }
    .toast-title { font-size: 14px; font-weight: 600; }
    .toast-subtitle { font-size: 12px; color: rgba(255,255,255,0.72); }
    .toast-action {
      border: none; background: rgba(255,255,255,0.14); color: white;
      padding: 9px 14px; border-radius: 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: transform 0.15s ease, background 0.15s ease;
    }
    .toast-action:active { transform: scale(0.96); background: rgba(255,255,255,0.22); }
    .empty { grid-column: 1/-1; }
    .empty-state {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      text-align: center; color: #6B7280; padding: 40px 20px;
      background: rgba(255,255,255,0.6); border-radius: 24px;
      border: 1px solid rgba(148,163,184,0.10);
      box-shadow: 0 12px 28px rgba(15,23,42,0.04);
    }
    .empty-state::before,
    .empty-state::after {
      content: '';
      position: absolute; inset: auto;
      pointer-events: none;
      border-radius: 999px;
      filter: blur(2px);
    }
    .empty-state::before {
      width: 180px; height: 180px; right: -52px; top: -58px;
      background: radial-gradient(circle, rgba(10,132,255,0.08), rgba(10,132,255,0));
    }
    .empty-state::after {
      width: 150px; height: 150px; left: -48px; bottom: -54px;
      background: radial-gradient(circle, rgba(52,199,89,0.08), rgba(52,199,89,0));
    }
    .empty-illustration {
      position: relative; width: 100%; min-height: 70px;
      display: flex; align-items: center; justify-content: center; gap: 18px;
      margin-bottom: 2px; color: rgba(107,114,128,0.22);
      letter-spacing: 0.04em;
    }
    .empty-illustration span {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 21px;
      background: rgba(255,255,255,0.34);
      border: 1px solid rgba(148,163,184,0.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.42);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font-size: 18px; transform: rotate(-8deg);
    }
    .empty-illustration span:nth-child(2) {
      transform: translateY(-8px) rotate(6deg);
      font-size: 20px;
    }
    .empty-illustration span:nth-child(3) {
      transform: translateY(4px) rotate(-4deg);
    }
    .empty-state > * { position: relative; z-index: 1; }
    .empty-title { font-size: 18px; font-weight: 700; color: #111827; }
    .empty-copy { font-size: 14px; line-height: 1.55; max-width: 320px; }
    .empty-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .inline-action-btn {
      border: none; padding: 0; background: transparent; color: #0A84FF;
      font: inherit; font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
      cursor: pointer; transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .inline-action-btn:active { opacity: 0.72; transform: translateY(0.5px); }

    @keyframes placeholderPulse {
      0%, 100% { box-shadow: inset 0 0 0 1.5px rgba(0,122,255,0.18); }
      50% { box-shadow: inset 0 0 0 2px rgba(0,122,255,0.28), 0 10px 20px rgba(0,122,255,0.06); }
    }

    @media (max-width: 520px) {
      .header {
        align-items: flex-start;
        gap: 12px;
        flex-direction: column;
      }
      .header-actions { width: 100%; }
      .header-actions .icon-btn { flex: 0 0 36px; }
      .header-actions .btn { flex: 1; justify-content: center; }
      .header-actions .header-quiet-btn { flex: 1 1 auto; }
      .card-grid { grid-template-columns: 1fr; }
      .tool-card {
        flex-direction: column; align-items: stretch;
      }
      .tool-card-actions { width: 100%; justify-content: stretch; }
      .tool-btn { flex: 1; }
      .modal-overlay {
        padding-left: 0;
        padding-right: 0;
      }
      .modal {
        width: 100%;
        border-radius: 28px 28px 0 0;
        max-height: calc(100dvh - max(10px, env(safe-area-inset-top)));
      }
      .modal-header {
        padding-left: 18px;
        padding-right: 18px;
      }
      .modal-body {
        padding: 8px 18px 18px;
      }
      .modal-footer {
        margin-top: 0;
        padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
      }
      .modal-footer .btn,
      .modal-footer .tool-btn,
      .modal-footer .delete-btn {
        flex: 1 1 calc(50% - 5px);
      }
      .route-panel {
        padding: 12px 10px;
        border-radius: 18px;
      }
      .route-panel-header {
        gap: 8px;
        margin-bottom: 10px;
      }
      .route-panel-summary {
        font-size: 11px;
      }
      .time-range-inline {
        flex-direction: column;
        align-items: stretch;
      }
      .time-range-inline span {
        display: none;
      }
      .range-grid { grid-template-columns: 1fr; }
      .range-arrow { display: none; }
      .import-mode-grid { grid-template-columns: 1fr; }
      .selection-toolbar {
        width: calc(100vw - 24px);
        border-radius: 24px;
      }
    }

    .detail-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .back-btn {
      background: rgba(120,120,128,0.1); border: none; width: 40px; height: 40px;
      border-radius: 20px; font-size: 22px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: 0.15s;
    }
    .back-btn:active { background: rgba(120,120,128,0.2); transform: scale(0.94); }
    .detail-header h2 { font-size: 24px; font-weight: 650; }

    /* 水平滑动日期选择器 */
    .day-slider-wrapper {
      margin-bottom: 12px;
      position: relative;
    }
    .day-slider-wrapper::before,
    .day-slider-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 28px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      z-index: 2;
    }
    .day-slider-wrapper::before {
      left: 0;
      background: linear-gradient(90deg, rgba(242,242,247,0.98), rgba(242,242,247,0));
    }
    .day-slider-wrapper::after {
      right: 0;
      background: linear-gradient(270deg, rgba(242,242,247,0.98), rgba(242,242,247,0));
    }
    .day-slider-wrapper.has-left-mask::before,
    .day-slider-wrapper.has-right-mask::after {
      opacity: 1;
    }
    .day-slider {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      padding: 8px 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: grab;
      touch-action: pan-y;
    }
    .day-slider.dragging-slider {
      cursor: grabbing;
      scroll-behavior: auto;
    }
    .day-slider::-webkit-scrollbar { display: none; }
    .day-toggle {
      flex: 0 0 auto;
      background: rgba(229,229,234,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: none;
      padding: 12px 20px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      color: #000;
    }
    .day-toggle:active { background: rgba(209,209,214,0.8); transform: scale(0.97); }
    .day-toggle.edited {
      background: rgba(0,122,255,0.1);
      border-left: 3px solid var(--blue);
      color: #004080;
    }
    .day-toggle.active-day {
      background: var(--blue);
      color: white;
      box-shadow: 0 4px 12px rgba(0,122,255,0.35);
      font-weight: 600;
    }

    .day-content {
      display: grid; grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s ease;
      background: rgba(255,255,255,0.5); backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px); border-radius: 0 0 16px 16px;
      margin-top: 4px;
    }
    .day-content.open { grid-template-rows: 1fr; }
    .day-content > div { overflow: hidden; }
    .day-content-inner { padding: 12px 16px 16px; }

    .editor-toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .undo-btn {
      background: none; border: none; color: var(--blue); font-size: 14px;
      font-weight: 500; padding: 4px 12px; border-radius: 14px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      background: rgba(0,122,255,0.06); cursor: pointer;
    }
    .undo-btn:active { background: rgba(0,122,255,0.12); }

    .tag-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; align-items: center; }
    .tag-chip {
      padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 500;
      color: white; border: none; cursor: pointer; transition: all 0.2s;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 4px;
    }
    .tag-chip:active { transform: scale(0.94); }
    .tag-chip.disabled { filter: grayscale(100%); opacity: 0.45; }
    .tag-del {
      background: rgba(255,255,255,0.3); border: none; color: white;
      border-radius: 50%; width: 20px; height: 20px; font-size: 12px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .tag-chip.fixed .tag-del { display: none; }

    .timeline-container {
      --timeline-height: clamp(520px, calc(100dvh - 290px), 760px);
      background: rgba(255,255,255,0.55); backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px); border-radius: 18px;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02); position: relative;
    }
    .night-mask {
      position: absolute; top: 0; left: 40px; right: 8px;
      height: 25%;
      background: rgba(0,0,20,0.04); pointer-events: none; z-index: 0;
      border-radius: 0 0 10px 10px;
    }
    .timeline {
      position: relative;
      height: var(--timeline-height);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
      padding: 16px 0 8px 0;
    }

    @media (max-width: 640px) {

</head>
<body>
<div class="app" id="app"></div>
<script>
  const STORAGE_KEY = 'travel_plans_v13';
  const EXPORT_SCHEMA = 'travel-plans-export';
  const EXPORT_VERSION = 1;
  let plans = [];
  let currentPlanId = null;
  let openDay = null;
  const dayTimelineZoom = new Map();
  const undoStacks = {};
  let cardDragState = null;
  let deleteToastState = null;
  let ephemeralToastTimer = null;
  let selectionMode = false;
  let selectedPlanIds = new Set();
  let cardLongPressState = null;
  let suppressPlanOpenId = null;
  const CARD_LONG_PRESS_MS = 420;
  const uiLayerState = {
    modal: null,
    sheet: null,
    toast: null
  };

  const defaultTags = [
    { id: 'eat', name: '吃饭', icon: '🍽️', color: '#FF6B6B', deletable: false },
    { id: 'stay', name: '住宿', icon: '🛏️', color: '#4ECDC4', deletable: false },

    { id: 'rail', name: '高铁火车', icon: '🚄', color: '#06B6D4', dash: '12 6', summary: '铁路衔接' },

  ];

  const dayModeMeta = {

    undecided: { title: '待定日', note: '还存在较多未定内容，后续可继续补充。', color: '#8E8E93' }
  };

  const uiText = {
    badge: {
      dirty: '未保存更改',
      danger: '危险操作'
    },
    confirm: {
      exitEdit: {
        title: '退出编辑？',

    },
    action: {
      saveBack: '保存并返回',

      discard: '不保存',
      stay: '继续编辑',
      cancel: '取消',
      deleteActivity: '删除活动',
      deleteTag: '删除标签',
      undo: '撤销'
    },
    toast: {
      savedActivity: '已保存活动',
      addedActivity: '已添加活动',
      deletedActivity: '已删除活动',
      deletedTag: '已删除标签',
      createdTag: '已创建标签',
      createdPlan: '已创建计划',
      importedPlans: '已导入计划',
      exportedPlans: '已导出 JSON',
      removed: (label) => `已移除 ${label}`,
      undoWindow: '4 秒内可撤销'
    },
    validation: {
      activityEndAfterStart: '结束时间需晚于开始',
      transportNeedsEndpoints: '行程事件必须填写起点和终点',
      transportNeedsMode: '行程事件必须选择交通方式',
      planNeedsDates: '请选择日期',
      planEndAfterStart: '结束日期不能早于开始',
      importNeedsFile: '请选择一个 JSON 文件',
      importInvalidFile: '文件格式不符合当前导入规范',
      importNoPlans: '文件中没有可导入的计划'
    }
  };

  function createDefaultTagCopies() {
    return defaultTags.map(tag => ({ ...tag }));
  }

  function createDefaultDayData() {
    return { activities: [], tags: createDefaultTagCopies(), hiddenTags: [] };
  }

  function safeParseJson(text, fallback = null) {
    try {
      return JSON.parse(text);
    } catch (error) {
      return fallback;
    }
  }

  function isValidDateString(value) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ''))) return false;
    const parsed = new Date(`${value}T00:00:00`);
    return !Number.isNaN(parsed.getTime()) && toIsoDate(parsed) === value;
  }

  function parseDateString(value) {
    if (!isValidDateString(value)) return null;
    return new Date(`${value}T00:00:00`);
  }

  function toIsoDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function getTodayDateString() {
    return toIsoDate(new Date());
  }

  function addDaysToDateString(dateString, days) {
    const baseDate = parseDateString(dateString) || new Date();
    const nextDate = new Date(baseDate);
    nextDate.setDate(nextDate.getDate() + days);
    return toIsoDate(nextDate);
  }

  function getTripLengthDays(start, end) {
    const startDate = parseDateString(start);
    const endDate = parseDateString(end);
    if (!startDate || !endDate || endDate < startDate) return 0;
    return Math.round((endDate - startDate) / 86400000) + 1;
  }

  function formatPlanDateSummary(dateString) {
    const parsed = parseDateString(dateString);
    if (!parsed) return '未选择';
    return new Intl.DateTimeFormat('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' }).format(parsed);
  }

  function getTripSummaryText(start, end) {
    const totalDays = getTripLengthDays(start, end);
    if (!totalDays) return '请选择有效的出发与结束日期';
    const nights = Math.max(0, totalDays - 1);
    return `共 ${totalDays} 天 · ${nights} 晚 · ${formatPlanDateSummary(start)} → ${formatPlanDateSummary(end)}`;
  }

  function isValidTimeString(value) {
    return /^([01]\d|2[0-3]):([0-5]\d)$/.test(String(value || ''));
  }

  function normalizeImportedTimeRange(startTime, endTime) {
    const startMin = timeToMin(isValidTimeString(startTime) ? startTime : '08:00');
    const fallbackEnd = isValidTimeString(endTime) ? timeToMin(endTime) : startMin + 60;
    const range = clampActivityRange(startMin, fallbackEnd);
    return {
      startTime: minToTime(range.startMin),
      endTime: minToTime(range.endMin)
    };
  }

  function normalizeTagCollection(tags) {
    const defaultTagMap = new Map(defaultTags.map(tag => [tag.id, { ...tag }]));
    const customTags = [];
    (Array.isArray(tags) ? tags : []).forEach(tag => {
      const id = String(tag?.id || '').trim();
      if (!id || defaultTagMap.has(id)) return;
      customTags.push({
        id,
        name: String(tag?.name || '未命名标签').trim() || '未命名标签',
        icon: String(tag?.icon || '🏷️').trim() || '🏷️',
        color: String(tag?.color || '#94A3B8').trim() || '#94A3B8',
        deletable: tag?.deletable !== false
      });
    });
    return [...defaultTagMap.values(), ...customTags];
  }

  function normalizeImportedActivity(activity, validTagIds) {
    const range = normalizeImportedTimeRange(activity?.startTime, activity?.endTime);
    const tagId = validTagIds.has(String(activity?.tagId || '').trim()) ? String(activity?.tagId || '').trim() : 'undecided';
    const isTransport = tagId === 'transport';
    const transportMode = transportModes.some(mode => mode.id === activity?.transportMode) ? activity.transportMode : 'walk';
    return {
      id: generateId(),
      startTime: range.startTime,
      endTime: range.endTime,
      title: String(activity?.title || '').trim(),
      location: isTransport ? '' : String(activity?.location || '').trim(),
      startLocation: isTransport ? String(activity?.startLocation || '').trim() : '',
      endLocation: isTransport ? String(activity?.endLocation || '').trim() : '',
      transportMode: isTransport ? transportMode : '',
      description: String(activity?.description || activity?.note || '').trim(),
      tagId
    };
  }

  function normalizeImportedDay(dayData) {
    const tags = normalizeTagCollection(dayData?.tags);
    const validTagIds = new Set(tags.map(tag => tag.id));
    const activities = (Array.isArray(dayData?.activities) ? dayData.activities : [])
      .map(activity => normalizeImportedActivity(activity, validTagIds));
    const hiddenTags = (Array.isArray(dayData?.hiddenTags) ? dayData.hiddenTags : [])
      .map(tagId => String(tagId || '').trim())
      .filter(tagId => validTagIds.has(tagId));
    return { activities, tags, hiddenTags };
  }

  function normalizePlanRecord(plan, options = {}) {
    const settings = { preserveId: false, ...options };
    const startDate = String(plan?.startDate || '').trim();
    const endDate = String(plan?.endDate || '').trim();
    if (!isValidDateString(startDate) || !isValidDateString(endDate)) return null;
    if (parseDateString(endDate) < parseDateString(startDate)) return null;
    const days = {};
    getDaysArray(startDate, endDate).forEach(date => {
      days[date] = normalizeImportedDay(plan?.days?.[date]);
    });
    return {
      id: settings.preserveId && Number.isFinite(Number(plan?.id)) ? Number(plan.id) : generateId(),
      title: String(plan?.title || '未命名计划').trim() || '未命名计划',
      startDate,
      endDate,
      days
    };
  }

  function extractPlansPayload(payload) {
    if (Array.isArray(payload)) return { plans: payload, meta: null };
    const payloadSchema = String(payload?.schema || payload?.type || '').trim();
    if (payload && payloadSchema === EXPORT_SCHEMA && Array.isArray(payload.plans)) {
      return {
        plans: payload.plans,
        meta: {
          exportedAt: payload.exportedAt || '',
          version: payload.version || EXPORT_VERSION,
          planCount: payload.planCount || payload.plans.length
        }
      };
    }
    return null;
  }

  function normalizeImportedPlans(payload, options = {}) {
    const extracted = extractPlansPayload(payload);
    if (!extracted) return [];
    return extracted.plans
      .map(plan => normalizePlanRecord(plan, options))
      .filter(Boolean);
  }

  function buildExportPayload(sourcePlans = plans) {
    const snapshot = sourcePlans
      .map(plan => normalizePlanRecord(plan, { preserveId: true }))
      .filter(Boolean);
    return {
      schema: EXPORT_SCHEMA,
      type: EXPORT_SCHEMA,
      version: EXPORT_VERSION,
      exportedAt: new Date().toISOString(),
      planCount: snapshot.length,
      plans: snapshot
    };
  }

  function load() {
    const parsed = safeParseJson(localStorage.getItem(STORAGE_KEY), []);
    plans = normalizeImportedPlans(parsed, { preserveId: true });
  }

  function save() {
    const snapshot = plans
      .map(plan => normalizePlanRecord(plan, { preserveId: true }))
      .filter(Boolean);
    plans = snapshot;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
  }

  function getPlan(id) { return plans.find(p => p.id === id); }
  function getPlanIndex(id) { return plans.findIndex(p => p.id === id); }
  function generateId() { return Date.now() + Math.floor(Math.random() * 1000000); }
  function getDaysArray(start, end) {
    const arr = [];
    let cur = new Date(start + 'T00:00:00');
    const last = new Date(end + 'T00:00:00');
    while (cur <= last) {
      const y = cur.getFullYear();
      const m = String(cur.getMonth()+1).padStart(2,'0');
      const d = String(cur.getDate()).padStart(2,'0');
      arr.push(`${y}-${m}-${d}`);
      cur.setDate(cur.getDate()+1);
    }
    return arr;
  }

  function initDays(plan) {
    const days = getDaysArray(plan.startDate, plan.endDate);
    if (!plan.days) plan.days = {};
    days.forEach(d => {
      if (!plan.days[d]) plan.days[d] = createDefaultDayData();
      else plan.days[d] = normalizeImportedDay(plan.days[d]);
      if (!undoStacks[d]) undoStacks[d] = [];
    });
    save();
  }

  function snapshotDate(date) {
    const plan = getPlan(currentPlanId);
    const day = plan.days[date];
    if (!day) return;
    const snap = {
      activities: JSON.parse(JSON.stringify(day.activities)),
      tags: JSON.parse(JSON.stringify(day.tags)),
      hiddenTags: day.hiddenTags ? [...day.hiddenTags] : []
    };
    if (!undoStacks[date]) undoStacks[date] = [];
    undoStacks[date].push(snap);
    if (undoStacks[date].length > 20) undoStacks[date].shift();
  }

  function undo(date) {
    const stacks = undoStacks[date];
    if (!stacks || stacks.length < 2) return;
    stacks.pop();
    const prev = stacks[stacks.length - 1];
    const day = getPlan(currentPlanId).days[date];
    day.activities = JSON.parse(JSON.stringify(prev.activities));
    day.tags = JSON.parse(JSON.stringify(prev.tags));
    day.hiddenTags = prev.hiddenTags ? [...prev.hiddenTags] : [];
    save();
    refreshDayStructure(date);
  }

  function dayEdited(plan, date) { return plan.days[date] && plan.days[date].activities.length > 0; }

  function updateDayToggleStyle(date) {
    const plan = getPlan(currentPlanId);
    const toggle = document.querySelector(`.day-toggle[data-date="${date}"]`);
    if (toggle) {
      if (dayEdited(plan, date)) toggle.classList.add('edited');
      else toggle.classList.remove('edited');
    }
  }

  function timeToMin(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
  function minToTime(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
  function clampTime(min) { return Math.max(0, Math.min(min, 24*60)); }

  function clampActivityRange(startMin, endMin) {
    const safeStart = clampTime(startMin);
    const safeEnd = clampTime(Math.max(endMin, safeStart + 15));
    if (safeEnd <= safeStart) {
      return {
        startMin: safeStart,
        endMin: clampTime(safeStart + 15)
      };
    }
    return {
      startMin: safeStart,
      endMin: safeEnd
    };
  }

  function getTimelineMetrics(timeline) {
    const styles = getComputedStyle(timeline);
    const paddingTop = parseFloat(styles.paddingTop) || 0;
    const paddingBottom = parseFloat(styles.paddingBottom) || 0;
    const height = timeline.clientHeight;
    const usableHeight = Math.max(1, height - paddingTop - paddingBottom);
    return { paddingTop, paddingBottom, height, usableHeight };
  }

  function timelineMinutesToOffset(timeline, minutes) {
    const { paddingTop, usableHeight } = getTimelineMetrics(timeline);
    return paddingTop + (clampTime(minutes) / (24 * 60)) * usableHeight;
  }

  function timelineOffsetToMinutes(timeline, offsetY) {
    const { paddingTop, usableHeight } = getTimelineMetrics(timeline);
    const clampedOffset = Math.max(paddingTop, Math.min(offsetY, paddingTop + usableHeight));
    return clampTime(Math.round(((clampedOffset - paddingTop) / usableHeight) * 24 * 60));
  }

  function timelineClientYToMinutes(timeline, clientY) {
    const rect = timeline.getBoundingClientRect();
    return timelineOffsetToMinutes(timeline, clientY - rect.top);
  }

  function getPointerDragThreshold(pointerEvent, defaultThreshold, touchThreshold) {
    return pointerEvent && (pointerEvent.pointerType === 'touch' || pointerEvent.pointerType === 'pen')
      ? touchThreshold
      : defaultThreshold;
  }

  function updateSnapHapticState(tracker, minutes, triggerImmediately = false) {
    const snappedMinutes = snapMinutesToQuarter(minutes);
    if (tracker.value == null) {
      tracker.value = snappedMinutes;
      if (triggerImmediately) triggerHaptic('tick');
      return snappedMinutes;
    }
    if (snappedMinutes !== tracker.value) {
      tracker.value = snappedMinutes;
      triggerHaptic('tick');
    }
    return snappedMinutes;
  }

  function setTimelineSpanPosition(element, timeline, startMinutes, endMinutes) {
    const top = timelineMinutesToOffset(timeline, startMinutes);
    const bottom = timelineMinutesToOffset(timeline, endMinutes);
    element.style.top = `${top}px`;
    element.style.height = `${Math.max(0, bottom - top)}px`;
  }

  function activitiesOverlap(a, b) {
    return timeToMin(a.endTime) > timeToMin(b.startTime) && timeToMin(b.endTime) > timeToMin(a.startTime);
  }

  function computeActivityLayout(activities) {
    const layoutMap = {};
    const count = activities.length;
    if (!count) return layoutMap;

    const adjacency = Array.from({ length: count }, () => []);
    for (let i = 0; i < count; i++) {
      for (let j = i + 1; j < count; j++) {
        if (activitiesOverlap(activities[i], activities[j])) {
          adjacency[i].push(j);
          adjacency[j].push(i);
        }
      }
    }

    const visited = new Array(count).fill(false);
    for (let i = 0; i < count; i++) {
      if (visited[i]) continue;

      const queue = [i];
      const group = [];
      visited[i] = true;

      while (queue.length) {
        const index = queue.shift();
        group.push(index);
        adjacency[index].forEach(neighbor => {
          if (!visited[neighbor]) {
            visited[neighbor] = true;
            queue.push(neighbor);
          }
        });
      }

      const sortedGroup = group.map(index => ({
        ...activities[index],
        origIdx: index,
        startMin: timeToMin(activities[index].startTime),
        endMin: timeToMin(activities[index].endTime)
      })).sort((a, b) => {
        if (a.startMin !== b.startMin) return a.startMin - b.startMin;
        if (a.endMin !== b.endMin) return b.endMin - a.endMin;
        return a.origIdx - b.origIdx;
      });

      const columns = [];
      sortedGroup.forEach(activity => {
        let columnIndex = columns.findIndex(column => column[column.length - 1].endMin <= activity.startMin);
        if (columnIndex === -1) {
          columns.push([]);
          columnIndex = columns.length - 1;
        }
        activity.col = columnIndex;
        columns[columnIndex].push(activity);
      });

      const totalColumns = columns.length;
      sortedGroup.forEach(activity => {
        let span = 1;
        for (let nextCol = activity.col + 1; nextCol < totalColumns; nextCol++) {
          const blocked = columns[nextCol].some(other => other.startMin < activity.endMin && other.endMin > activity.startMin);
          if (blocked) break;
          span += 1;
        }
        layoutMap[activity.origIdx] = { col: activity.col, span, total: totalColumns };
      });
    }

    return layoutMap;
  }

  function sortActivitiesByTime(activities) {
    return [...activities].sort((a, b) => {
      const startDelta = timeToMin(a.startTime) - timeToMin(b.startTime);
      if (startDelta !== 0) return startDelta;
      const endDelta = timeToMin(a.endTime) - timeToMin(b.endTime);
      if (endDelta !== 0) return endDelta;
      return (a.id || 0) - (b.id || 0);
    });
  }

  function isTransportTagId(tagId) {
    return tagId === 'transport';
  }

  function isUndecidedTagId(tagId) {
    return tagId === 'undecided';
  }

  function isTransportActivity(activity) {
    return isTransportTagId(activity?.tagId);
  }

  function isUndecidedActivity(activity) {
    return isUndecidedTagId(activity?.tagId);
  }

  function doesTagAffectRouteDisplay(dayData, tagId) {
    return (dayData?.activities || []).some(activity => {
      if (activity?.tagId !== tagId) return false;
      if (isUndecidedActivity(activity) || isTransportActivity(activity)) return false;
      return Boolean(getActivityLocation(activity));
    });
  }

  function getActivityDurationMinutes(activity) {
    return Math.max(0, timeToMin(activity.endTime) - timeToMin(activity.startTime));
  }

  function formatDurationHours(minutes) {
    const hours = Math.max(0, minutes) / 60;
    const rounded = Math.round(hours * 10) / 10;
    return `${Number.isInteger(rounded) ? rounded.toFixed(0) : rounded.toFixed(1)} 小时`;
  }

  function getTransportDensity(durationMinutes) {
    if (durationMinutes < 60) return 'compact';
    if (durationMinutes >= 180) return 'expanded';
    return 'regular';
  }

  function getActivityPreviewDensity(durationMinutes, heightPct, isTransport = false) {
    if (isTransport) return getTransportDensity(durationMinutes);
    if (durationMinutes < 60 || heightPct < 6) return 'compact';
    if (durationMinutes >= 150 || heightPct >= 14) return 'expanded';
    return 'regular';
  }

  function getActivityTimeLabel(activity) {
    return `${activity.startTime} - ${activity.endTime}${getActivityDurationMinutes(activity) ? ` · ${formatDurationHours(getActivityDurationMinutes(activity))}` : ''}`;
  }

  function getCompactActivityTimeLabel(activity) {
    return `${activity.startTime}-${activity.endTime}`;
  }

  function getActivityPreviewNote(activity) {
    const description = String(activity.description || '').trim();
    if (description) return description;
    if (isTransportActivity(activity)) return '';
    const location = String(activity.location || '').trim();
    return location ? `地点：${location}` : '';
  }

  function getActivityDisplayTitle(activity) {
    const title = String(activity?.title || '').trim();
    if (title) return title;
    if (isTransportActivity(activity)) {
      return `${String(activity?.startLocation || '起点').trim()} → ${String(activity?.endLocation || '终点').trim()}`;
    }
    return '未命名活动';
  }

  function getActivityLocation(activity) {
    return String(activity.location || activity.title || '').trim();
  }

  function getDaySummaryMode(dayStats) {
    const ranked = ['sight', 'eat', 'shop', 'stay', 'transport']
      .map(id => dayStats[id])
      .filter(item => item && item.count > 0)
      .sort((left, right) => {
        if (right.duration !== left.duration) return right.duration - left.duration;
        return right.count - left.count;
      });
    if (!ranked.length) {
      return dayStats.undecided.count > 0 ? dayModeMeta.undecided : dayModeMeta.stay;
    }
    if (dayStats.undecided.count > ranked[0].count && dayStats.undecided.count >= 2) {
      return dayModeMeta.undecided;
    }
    return dayModeMeta[ranked[0].tag.id] || dayModeMeta.sight;
  }

  function summarizeDayByDefaultTags(dayData) {
    const stats = Object.fromEntries(defaultTags.map(tag => [tag.id, {
      tag,
      count: 0,
      duration: 0,
      locations: new Set()
    }]));
    sortActivitiesByTime(dayData?.activities || []).forEach(activity => {
      const bucket = stats[activity?.tagId];
      if (!bucket) return;
      bucket.count += 1;
      bucket.duration += getActivityDurationMinutes(activity);
      if (isTransportActivity(activity)) {
        const startLocation = String(activity.startLocation || '').trim();
        const endLocation = String(activity.endLocation || '').trim();
        if (startLocation) bucket.locations.add(startLocation);
        if (endLocation) bucket.locations.add(endLocation);
        return;
      }
      const location = getActivityLocation(activity);
      if (location) bucket.locations.add(location);
    });
    const items = ['sight', 'eat', 'shop', 'stay', 'transport', 'undecided']
      .map(id => {
        const bucket = stats[id];
        if (!bucket || bucket.count === 0) return null;
        const locations = Array.from(bucket.locations).slice(0, 2);
        if (id === 'sight') return { id, icon: bucket.tag.icon, text: `景点 ${bucket.count} 个${bucket.duration ? ` · ${formatDurationHours(bucket.duration)}` : ''}` };
        if (id === 'eat') return { id, icon: bucket.tag.icon, text: `用餐 ${bucket.count} 次${locations.length ? ` · ${locations.join(' / ')}` : ''}` };
        if (id === 'shop') return { id, icon: bucket.tag.icon, text: `购物 ${bucket.count} 次${locations.length ? ` · ${locations.join(' / ')}` : ''}` };
        if (id === 'stay') return { id, icon: bucket.tag.icon, text: `住宿 ${bucket.count} 段${locations.length ? ` · ${locations[0]}` : ''}` };
        if (id === 'transport') return { id, icon: bucket.tag.icon, text: `移动 ${bucket.count} 段${bucket.duration ? ` · 在途 ${formatDurationHours(bucket.duration)}` : ''}` };
        return { id, icon: bucket.tag.icon, text: `未定 ${bucket.count} 项` };
      })
      .filter(Boolean);
    return {
      mode: getDaySummaryMode(stats),
      items
    };
  }

  function getTransportMeta(mode) {
    return transportModes.find(item => item.id === mode) || transportModes[0];
  }

  function getTransportMode(activity, fallback = 'walk') {
    return activity?.transportMode || fallback;
  }

  function getRouteTransportSummary(stops, maxItems = 3) {
    const modes = [];
    stops.forEach((stop, index) => {
      if (index === 0 || !stop.transportMode || stop.implicitTransport) return;
      const meta = getTransportMeta(stop.transportMode);
      const last = modes[modes.length - 1];
      if (last?.id === meta.id) return;
      modes.push(meta);
    });
    return modes.slice(0, maxItems);
  }

  function renderTransportChip(mode) {
    const meta = getTransportMeta(mode);
    return `<span class="route-transport-chip" style="color:${meta.color};">${meta.icon} ${meta.name}</span>`;
  }

  function formatRouteDate(date) {
    return date ? date.slice(5).replace('-', '/') : '';
  }

  function getRouteStopBoundaryKey(stop, boundary = 'start') {
    const date = boundary === 'end'
      ? (stop?.endDate || stop?.date || '0000-00-00')
      : (stop?.startDate || stop?.date || '0000-00-00');
    const time = boundary === 'end'
      ? (stop?.endTime || stop?.startTime || '00:00')
      : (stop?.startTime || stop?.endTime || '00:00');
    return `${date} ${time}`;
  }

  function mergeRouteStopData(targetStop, sourceStop) {
    if (!targetStop || !sourceStop) return targetStop;
    targetStop.endTime = sourceStop.endTime || targetStop.endTime;
    targetStop.endDate = sourceStop.endDate || sourceStop.date || targetStop.endDate || targetStop.date;
    targetStop.title = sourceStop.title || targetStop.title;
    if (sourceStop.tagId) targetStop.tagId = sourceStop.tagId;
    if (sourceStop.tagIcon) targetStop.tagIcon = sourceStop.tagIcon;
    if (sourceStop.tagColor) targetStop.tagColor = sourceStop.tagColor;
    if (sourceStop.tagName) targetStop.tagName = sourceStop.tagName;
    if (sourceStop.transportMode) targetStop.transportMode = sourceStop.transportMode;
    if (sourceStop.travelDurationMinutes != null) targetStop.travelDurationMinutes = sourceStop.travelDurationMinutes;
    if (sourceStop.implicitTransport != null) targetStop.implicitTransport = sourceStop.implicitTransport;
    if (sourceStop.unresolvedGap != null) targetStop.unresolvedGap = sourceStop.unresolvedGap;
    if (sourceStop.incomingRefs?.length) targetStop.incomingRefs.push(...sourceStop.incomingRefs);
    if (sourceStop.outgoingRefs?.length) targetStop.outgoingRefs.push(...sourceStop.outgoingRefs);
    if (sourceStop.stayRefs?.length) targetStop.stayRefs.push(...sourceStop.stayRefs);
    return targetStop;
  }

  function routeStopsOverlap(leftStop, rightStop) {
    const leftStart = getRouteStopBoundaryKey(leftStop, 'start');
    const leftEnd = getRouteStopBoundaryKey(leftStop, 'end');
    const rightStart = getRouteStopBoundaryKey(rightStop, 'start');
    const rightEnd = getRouteStopBoundaryKey(rightStop, 'end');
    return leftStart < rightEnd && rightStart < leftEnd;
  }

  function canMergeRouteStops(lastStop, nextStop) {
    if (!lastStop || !nextStop) return false;
    if (lastStop.location !== nextStop.location) return false;
    if (routeStopsOverlap(lastStop, nextStop)) return false;
    return getRouteStopBoundaryKey(lastStop, 'end') === getRouteStopBoundaryKey(nextStop, 'start');
  }

  function appendRouteStop(stops, stop) {
    const lastStop = stops[stops.length - 1];
    if (canMergeRouteStops(lastStop, stop)) {
      return mergeRouteStopData(lastStop, stop);
    }
    const nextStop = {
      startDate: stop?.startDate || stop?.date || '',
      endDate: stop?.endDate || stop?.date || '',
      tagId: '',
      tagIcon: '',
      tagColor: '',
      tagName: '',
      transportMode: '',
      travelDurationMinutes: 0,
      implicitTransport: false,
      unresolvedGap: false,
      incomingRefs: [],
      outgoingRefs: [],
      stayRefs: [],
      ...stop
    };
    stops.push(nextStop);
    return nextStop;
  }

  function getRouteTravelDurationMinutes(route) {
    return (route?.stops || []).reduce((total, stop, index) => {
      if (index === 0) return total;
      return total + (stop.travelDurationMinutes || 0);
    }, 0);
  }

  function getRouteStopCount(route) {
    return Math.max(0, (route?.stops || []).length - 1);
  }

  function formatRouteStopCount(route) {
    const count = getRouteStopCount(route);
    if (count === 0) return '未出发';
    return `${count} 站`;
  }

  function toAlphaColor(color, alpha, fallback = 'rgba(148,163,184,0.18)') {
    const value = String(color || '').trim();
    const normalizedAlpha = Math.max(0, Math.min(1, alpha));
    const hex = value.replace('#', '');
    if (/^[0-9a-f]{3}$/i.test(hex)) {
      const r = parseInt(hex[0] + hex[0], 16);
      const g = parseInt(hex[1] + hex[1], 16);
      const b = parseInt(hex[2] + hex[2], 16);
      return `rgba(${r}, ${g}, ${b}, ${normalizedAlpha})`;
    }
    if (/^[0-9a-f]{6}$/i.test(hex)) {
      const r = parseInt(hex.slice(0, 2), 16);
      const g = parseInt(hex.slice(2, 4), 16);
      const b = parseInt(hex.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${normalizedAlpha})`;
    }
    return fallback;
  }

  function getRouteGapDurationMinutes(fromStop, toStop) {
    const fromDate = String(fromStop?.endDate || fromStop?.date || '').trim();
    const toDate = String(toStop?.startDate || toStop?.date || '').trim();
    const fromTime = String(fromStop?.endTime || fromStop?.startTime || '').trim();
    const toTime = String(toStop?.startTime || toStop?.endTime || '').trim();
    if (!fromDate || !toDate || !fromTime || !toTime) return 0;
    const fromValue = Date.parse(`${fromDate}T${fromTime}:00`);
    const toValue = Date.parse(`${toDate}T${toTime}:00`);
    if (!Number.isFinite(fromValue) || !Number.isFinite(toValue) || toValue <= fromValue) return 0;
    return Math.round((toValue - fromValue) / 60000);
  }

  function getRouteStopSegmentColor(stop) {
    if (!stop) return '';
    if (stop.transportMode && !stop.implicitTransport) return getTransportMeta(stop.transportMode).color;
    return stop.tagColor || '';
  }

  function buildRouteSegments(stops) {
    return (stops || []).slice(1).map((stop, index) => {
      const from = stops[index];
      const segmentRef = (stop.incomingRefs || []).slice().reverse().find(ref => ref.kind === 'transport-end' || ref.kind === 'implicit-arrival');
      const unresolvedGap = Boolean(stop.unresolvedGap);
      const explicitTransport = Boolean(stop.transportMode && !stop.implicitTransport);
      const overlapsInTime = routeStopsOverlap(from, stop);
      const neutralGap = !unresolvedGap && !explicitTransport && !overlapsInTime;
      const anchorCurrentStopOnly = !unresolvedGap && !explicitTransport && Boolean(stop.stayRefs?.length);
      const transportId = explicitTransport ? stop.transportMode : 'walk';
      const meta = getTransportMeta(transportId);
      const displayIcon = unresolvedGap ? '' : (!explicitTransport && stop.tagIcon ? stop.tagIcon : meta.icon);
      const displayColor = unresolvedGap ? '#94A3B8' : (!explicitTransport && stop.tagColor ? stop.tagColor : meta.color);
      const displayName = unresolvedGap ? '未定义衔接' : (!explicitTransport && stop.tagName ? stop.tagName : meta.name);
      const strokeColor = unresolvedGap || neutralGap ? '#94A3B8' : (!explicitTransport && stop.tagColor ? stop.tagColor : meta.color);
      const fromColor = getRouteStopSegmentColor(from);
      const toColor = getRouteStopSegmentColor(stop);
      const gapDurationMinutes = unresolvedGap ? getRouteGapDurationMinutes(from, stop) : 0;
      const sameLocationImplicit = !unresolvedGap
        && !explicitTransport
        && String(from?.location || '').trim()
        && String(from?.location || '').trim() === String(stop?.location || '').trim()
        && !stop.travelDurationMinutes
        && !overlapsInTime;
      return {
        kind: segmentRef?.kind || '',
        activityIndex: segmentRef?.activityIndex ?? null,
        fromIndex: index,
        toIndex: index + 1,
        stopIndices: anchorCurrentStopOnly ? [index + 1] : [index, index + 1],
        from,
        to: stop,
        explicitTransport,
        unresolvedGap,
        neutralGap,
        sameLocationImplicit,
        anchorCurrentStopOnly,
        visibleInRouteList: unresolvedGap || explicitTransport || (!anchorCurrentStopOnly && !sameLocationImplicit),
        meta: unresolvedGap || neutralGap ? { ...meta, dash: '7 7' } : (!explicitTransport ? { ...meta, dash: '0' } : meta),
        displayIcon,
        displayColor,
        displayName,
        strokeColor,
        fromColor,
        toColor,
        overlapsInTime,
        showBadge: !unresolvedGap && Boolean(displayIcon),
        departTime: from.endTime || from.startTime || '',
        arriveTime: stop.startTime || stop.endTime || '',
        displayPath: anchorCurrentStopOnly ? stop.location : `${from.location} → ${stop.location}`,
        note: overlapsInTime
          ? '时间交叉 · 并行安排'
          : unresolvedGap
            ? `未定义时段${gapDurationMinutes ? ` · 空白 ${formatDurationHours(gapDurationMinutes)}` : ' · 待补充衔接'}`
          : neutralGap
            ? '无时间交集 · 灰色虚线衔接'
          : (stop.travelDurationMinutes
            ? `在途 ${formatDurationHours(stop.travelDurationMinutes)}`
            : (stop.implicitTransport ? '按活动顺序衔接' : '抵达下一站'))
      };
    });
  }

  function buildDayTimelineSegments(dayData) {
    const segments = [];
    const lanes = [];
    sortActivitiesByTime(dayData?.activities || []).forEach((activity, activityIndex) => {
      if (isUndecidedActivity(activity)) return;
      const startMin = timeToMin(activity.startTime);
      const endMin = timeToMin(activity.endTime);
      const tag = dayData?.tags?.find(item => item.id === activity.tagId);
      const isTransport = isTransportActivity(activity);
      const transportMeta = getTransportMeta(getTransportMode(activity, 'walk'));
      const segment = {
        activityIndex,
        startMin,
        endMin,
        title: getActivityDisplayTitle(activity),
        icon: isTransport ? transportMeta.icon : (tag?.icon || '•'),
        color: isTransport ? transportMeta.color : (tag?.color || '#64748B'),
        dash: isTransport ? transportMeta.dash : '0',
        isTransport
      };
      let lane = lanes.findIndex(lastEndMin => lastEndMin <= startMin);
      if (lane === -1) {
        lane = lanes.length;
        lanes.push(endMin);
      } else {
        lanes[lane] = endMin;
      }
      segment.lane = lane;
      segments.push(segment);
    });
    segments.forEach((segment, index) => {
      const prev = segments[index - 1];
      const next = segments[index + 1];
      segment.connectsFromPrev = Boolean(prev && prev.lane === segment.lane && prev.endMin === segment.startMin);
      segment.connectsToNext = Boolean(next && next.lane === segment.lane && segment.endMin === next.startMin);
    });
    return {
      segments,
      laneCount: Math.max(1, lanes.length)
    };
  }

  function renderDayTimelineSvg(dayData, date) {
    const timeline = buildDayTimelineSegments(dayData);
    if (!timeline.segments.length) return '';
    const ZOOM_STEPS = [1, 1.5, 2, 2.5, 3];
    const currentZoom = dayTimelineZoom.get(date) || 1;
    const zoomIdx = ZOOM_STEPS.findIndex(s => Math.abs(s - currentZoom) < 0.01);
    const safeZoomIdx = zoomIdx < 0 ? 0 : zoomIdx;
    const svgWidth = Math.round(760 * currentZoom);
    const zoomLabel = currentZoom === 1 ? '1×' : `${currentZoom}×`;
    const width = 520;
    const leftPad = 18;
    const rightPad = 18;
    const topPad = 36;
    const laneGap = 34;
    const usableWidth = width - leftPad - rightPad;
    const height = topPad + timeline.laneCount * laneGap + 14;
    const ticks = [0, 3, 6, 9, 12, 15, 18, 21, 24];
    const positioned = timeline.segments.map(segment => {
      const x1 = leftPad + (usableWidth * segment.startMin) / (24 * 60);
      const x2 = leftPad + (usableWidth * segment.endMin) / (24 * 60);
      const y = topPad + segment.lane * laneGap;
      return {
        ...segment,
        x1,
        x2: Math.max(x2, x1 + 10),
        y,
        midX: (x1 + Math.max(x2, x1 + 10)) / 2
      };
    });
    const connectionMarkers = [];
    positioned.forEach(segment => {
      if (segment.connectsFromPrev) {
        connectionMarkers.push({ x: segment.x1, y: segment.y, color: segment.color });
      }
    });
    return `
      <div class="route-timeline-header">
        <span class="route-timeline-header-label">时间轴</span>
        <div class="route-zoom-controls">
          <button class="route-zoom-btn" data-zoom-action="out" aria-label="缩小"${safeZoomIdx <= 0 ? ' disabled' : ''}>−</button>
          <span class="route-zoom-level">${zoomLabel}</span>
          <button class="route-zoom-btn" data-zoom-action="in" aria-label="放大"${safeZoomIdx >= ZOOM_STEPS.length - 1 ? ' disabled' : ''}>+</button>
        </div>
      </div>
      <div class="route-timeline-scroll">
      <div class="route-timeline-stage">
      <svg class="route-svg route-timeline-svg" style="width:${svgWidth}px" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="group" aria-label="当天活动时间轴">
        ${ticks.map((hour, i) => {
          const x = leftPad + (usableWidth * (hour * 60)) / (24 * 60);
          const lineY1 = topPad - 10;
          const lineY2 = height - 10;
          const anchor = i === 0 ? 'start' : (i === ticks.length - 1 ? 'end' : 'middle');
          return `
            <g>
              <line x1="${x}" y1="${lineY1}" x2="${x}" y2="${lineY2}" stroke="rgba(148,163,184,0.18)" stroke-width="1"></line>
              <text x="${x}" y="14" text-anchor="${anchor}" font-size="10" fill="#94A3B8">${String(hour).padStart(2, '0')}:00</text>
            </g>`;
        }).join('')}
        ${connectionMarkers.map(marker => `
          <g class="route-timeline-connector-separator" transform="translate(${marker.x}, ${marker.y})">
            <circle r="8.5" fill="rgba(248,250,252,0.72)"></circle>
            <circle r="6.2" fill="rgba(255,255,255,0.88)"></circle>
            <circle r="4.4" fill="${toAlphaColor(marker.color, 0.10)}"></circle>
          </g>`).join('')}
        ${positioned.map(segment => `
          <g class="route-timeline-segment" data-activity-index="${segment.activityIndex}" data-center-x="${segment.midX}" tabindex="0" role="button" aria-label="查看 ${escapeHtml(segment.title)} 时间段">
            <line class="route-timeline-line" x1="${segment.x1}" y1="${segment.y}" x2="${segment.x2}" y2="${segment.y}" stroke="${segment.color}" stroke-width="${segment.isTransport ? 5 : 4}" stroke-linecap="round" stroke-dasharray="${segment.dash}" opacity="${segment.isTransport ? 0.88 : 0.68}"></line>
            <circle class="route-timeline-endpoint-hit start" data-endpoint="start" cx="${segment.x1}" cy="${segment.y}" r="16"></circle>
            <circle class="route-timeline-endpoint-hit end" data-endpoint="end" cx="${segment.x2}" cy="${segment.y}" r="16"></circle>
            <circle class="route-timeline-endpoint start${segment.connectsFromPrev ? ' continuous-start' : ''}" data-endpoint="start" cx="${segment.x1}" cy="${segment.y}" r="${segment.isTransport ? 4 : 3.5}" fill="#fff" stroke="${segment.color}" stroke-width="2"></circle>
            <circle class="route-timeline-endpoint end${segment.connectsToNext ? ' continuous-end' : ''}" data-endpoint="end" cx="${segment.x2}" cy="${segment.y}" r="${segment.isTransport ? 4 : 3.5}" fill="#fff" stroke="${segment.color}" stroke-width="2"></circle>
            ${segment.connectsFromPrev ? `
              <g class="route-timeline-connector" transform="translate(${segment.x1}, ${segment.y})">
                <circle class="route-timeline-connector-core" r="6.2" fill="#fff" stroke="${segment.color}" stroke-width="2"></circle>
                <circle r="2.4" fill="${segment.color}"></circle>
              </g>
              <circle class="route-timeline-connector-hit" cx="${segment.x1}" cy="${segment.y}" r="16"></circle>` : ''}
            <g class="route-timeline-badge" transform="translate(${segment.midX}, ${segment.y + 16})">
              <rect x="-18" y="-10" width="36" height="20" rx="10" fill="rgba(255,255,255,0.92)"></rect>
              <text text-anchor="middle" dominant-baseline="central" font-size="11" fill="${segment.color}">${escapeHtml(segment.icon)}</text>
            </g>
            <g class="route-timeline-pin-badge" transform="translate(${segment.x2 + 12}, ${segment.y - 14})" opacity="0">
              <rect x="-14" y="-9" width="28" height="18" rx="9" fill="rgba(3,105,161,0.12)"></rect>
              <text text-anchor="middle" dominant-baseline="central" font-size="9" fill="#075985">锁定</text>
            </g>
          </g>`).join('')}
          </svg>
          </div>
          </div>`;
  }

  function getRouteSegmentStrokeOpacity(segment) {
    if (segment.unresolvedGap) return 0.78;
    return segment.explicitTransport ? 0.9 : 0.58;
  }

  function renderRouteSegmentCard(segment) {
    const modeLabel = segment.displayIcon ? `${segment.displayIcon} ${segment.displayName}` : segment.displayName;
    const cardStyle = !segment.unresolvedGap && !segment.explicitTransport && segment.displayColor
      ? ` style="background:${toAlphaColor(segment.displayColor, 0.10)}; border-color:${toAlphaColor(segment.displayColor, 0.22)};"`
      : '';
    return `
      <div class="route-segment-card${segment.explicitTransport ? '' : ' implicit'}${segment.unresolvedGap ? ' undefined' : ''}" data-segment-index="${segment.index}" data-stop-indices="${segment.stopIndices.join(',')}" data-activity-index="${segment.activityIndex != null ? segment.activityIndex : ''}" tabindex="0" role="button" aria-label="查看第 ${segment.index + 1} 段路线"${cardStyle}>
        <div class="route-segment-mode${segment.unresolvedGap ? ' subtle' : ''}" style="color:${segment.displayColor};">${modeLabel}</div>
        <div class="route-segment-path">${escapeHtml(segment.displayPath)}</div>
        <div class="route-segment-time">${escapeHtml(segment.departTime)} → ${escapeHtml(segment.arriveTime)}</div>
        <div class="route-segment-note">${escapeHtml(segment.note)}</div>
      </div>`;
  }

  function getRouteStopRole(stop, index) {
    if (index === 0) return stop.startTime === stop.endTime ? 'origin' : 'stay';
    if (stop.startTime === stop.endTime) return 'arrival';
    return 'stay';
  }

  function getRouteStopTimeLabel(stop, index) {
    const role = getRouteStopRole(stop, index);
    if (role === 'origin') return `起点 · ${stop.startTime}`;
    if (role === 'arrival') return `到站 · ${stop.endTime || stop.startTime}`;
    if (index === 0) return `首站 · ${stop.startTime} - ${stop.endTime}`;
    return `停留 · ${stop.startTime} - ${stop.endTime}`;
  }

  function getRouteStopMetaLabel(stop, index) {
    const role = getRouteStopRole(stop, index);
    if (role === 'origin') return stop.title && stop.title !== '出发' ? stop.title : '旅程起点';
    if (role === 'arrival') return stop.title || '抵达此站';
    return stop.title || (index === 0 ? '当天首站' : '安排活动');
  }

  function getRouteStopMarkerLabel(stop, index) {
    const role = getRouteStopRole(stop, index);
    if (role === 'origin') return '起';
    if (!stop.transportMode && stop.tagIcon) return stop.tagIcon;
    if (role === 'arrival' && index > 0) return `#${index}`;
    return index === 0 ? '1' : `${index + 1}`;
  }

  function getRouteStopMarkerStyle(stop, index) {
    const role = getRouteStopRole(stop, index);
    if (role === 'origin' || role === 'arrival') return '';
    if (stop.transportMode || !stop.tagColor) return '';
    const tint = /^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(stop.tagColor) ? `${stop.tagColor}22` : 'rgba(15,23,42,0.08)';
    return ` style="background:${tint}; color:${stop.tagColor};"`;
  }

  function getRouteStopPrimaryActivityIndex(stop) {
    const stayActivityIndex = (stop?.stayRefs || []).slice().reverse().find(ref => ref?.activityIndex != null)?.activityIndex;
    if (stayActivityIndex != null) return stayActivityIndex;
    const incomingActivityIndex = (stop?.incomingRefs || []).slice().reverse().find(ref => ref?.activityIndex != null)?.activityIndex;
    if (incomingActivityIndex != null) return incomingActivityIndex;
    const outgoingActivityIndex = (stop?.outgoingRefs || []).find(ref => ref?.activityIndex != null)?.activityIndex;
    if (outgoingActivityIndex != null) return outgoingActivityIndex;
    return null;
  }

  function getRouteStopNodeColor(stop, index, total) {
    if (stop?.transportMode && !stop.implicitTransport) {
      return getTransportMeta(stop.transportMode).color;
    }
    if (stop?.tagColor) return stop.tagColor;
    if (index === total - 1) return '#FF9F0A';
    if (index === 0) return '#34C759';
    return '#0A84FF';
  }

  function renderRouteStopPill(stop, index) {
    const role = getRouteStopRole(stop, index);
    const activityIndex = getRouteStopPrimaryActivityIndex(stop);
    return `
      <div class="route-stop-pill is-${role}" data-stop-index="${index}" data-activity-index="${activityIndex != null ? activityIndex : ''}" tabindex="0" role="button" aria-label="查看第 ${index + 1} 个站点关联路线">
        <div class="route-stop-topline">
          <span class="route-stop-marker"${getRouteStopMarkerStyle(stop, index)}>${escapeHtml(getRouteStopMarkerLabel(stop, index))}</span>
          <div class="route-stop-time">${escapeHtml(getRouteStopTimeLabel(stop, index))}</div>
        </div>
        <div class="route-stop-name">${escapeHtml(stop.location)}</div>
        <div class="route-stop-meta">${escapeHtml(getRouteStopMetaLabel(stop, index))}</div>
        ${stop.transportMode && !stop.implicitTransport ? `<div class="route-stop-transport" style="color:${getTransportMeta(stop.transportMode).color};">${getTransportMeta(stop.transportMode).icon} ${getTransportMeta(stop.transportMode).name}${stop.travelDurationMinutes ? ` · ${formatDurationHours(stop.travelDurationMinutes)}` : ''}</div>` : ''}
      </div>`;
  }

  function shiftActivityStartTime(activity, nextStartTime) {
    const duration = Math.max(15, getActivityDurationMinutes(activity));
    const startMin = clampTime(timeToMin(nextStartTime));
    const endMin = clampTime(startMin + duration);
    activity.startTime = minToTime(startMin);
    activity.endTime = minToTime(endMin > startMin ? endMin : startMin + 15);
  }

  function maybeSyncTransportTitle(activity, previousStartLocation) {
    if (!isTransportActivity(activity)) return;
    const defaultOldTitle = `${previousStartLocation} → ${activity.endLocation}`;
    const defaultNewTitle = `${activity.startLocation} → ${activity.endLocation}`;
    if (!activity.title || activity.title === defaultOldTitle) activity.title = defaultNewTitle;
  }

  function getActivityPrimaryLocation(activity) {
    if (isTransportActivity(activity)) return String(activity.endLocation || '').trim();
    return String(activity.location || '').trim();
  }

  function cascadeDayActivitiesFrom(dayData, seedActivityIndex) {
    const ordered = dayData.activities
      .map((activity, activityIndex) => ({ activity, activityIndex }))
      .sort((a, b) => {
        const startDelta = timeToMin(a.activity.startTime) - timeToMin(b.activity.startTime);
        if (startDelta !== 0) return startDelta;
        const endDelta = timeToMin(a.activity.endTime) - timeToMin(b.activity.endTime);
        if (endDelta !== 0) return endDelta;
        return a.activityIndex - b.activityIndex;
      });
    const seedPosition = ordered.findIndex(entry => entry.activityIndex === seedActivityIndex);
    if (seedPosition === -1) return 0;
    let shiftedCount = 0;
    let lastEndMin = timeToMin(ordered[seedPosition].activity.endTime);
    for (let index = seedPosition + 1; index < ordered.length; index++) {
      const nextActivity = ordered[index].activity;
      const nextStartMin = timeToMin(nextActivity.startTime);
      if (nextStartMin >= lastEndMin) {
        lastEndMin = timeToMin(nextActivity.endTime);
        continue;
      }
      shiftActivityStartTime(nextActivity, minToTime(lastEndMin));
      shiftedCount += 1;
      lastEndMin = timeToMin(nextActivity.endTime);
    }
    return shiftedCount;
  }

  function cleanupDayRouteActivities(dayData) {
    if (!dayData?.activities?.length) return;
    dayData.activities = dayData.activities.filter(activity => {
      if (!isTransportActivity(activity)) return true;
      const startLocation = String(activity.startLocation || '').trim();
      const endLocation = String(activity.endLocation || '').trim();
      return !startLocation || !endLocation || startLocation !== endLocation;
    });
  }

  function mergeRouteStopIntoSegmentStart(date, sourceStopIndex, targetStopIndex) {
    const plan = getPlan(currentPlanId);
    const dayData = plan?.days?.[date];
    if (!dayData) return false;
    const route = buildDayRoute(date, dayData);
    const segments = buildRouteSegments(route.stops);
    const sourceStop = route.stops[sourceStopIndex];
    const targetSegment = segments.find(segment => segment.fromIndex === targetStopIndex);
    if (!sourceStop || !targetSegment || targetSegment.activityIndex == null) return false;
    const activity = dayData.activities[targetSegment.activityIndex];
    if (!activity) return false;
    const previousLocation = isTransportActivity(activity)
      ? String(activity.startLocation || '').trim()
      : String(activity.location || '').trim();
    const nextStartTime = sourceStop.endTime || sourceStop.startTime;
    snapshotDate(date);
    if (isTransportActivity(activity)) {
      const previousStartLocation = activity.startLocation;
      activity.startLocation = sourceStop.location;
      shiftActivityStartTime(activity, nextStartTime);
      maybeSyncTransportTitle(activity, previousStartLocation);
    } else {
      activity.location = sourceStop.location;
      shiftActivityStartTime(activity, nextStartTime);
    }
    const shiftedCount = cascadeDayActivitiesFrom(dayData, targetSegment.activityIndex);
    cleanupDayRouteActivities(dayData);
    save();
    triggerHaptic('success');
    showEphemeralToast(
      `已将 ${previousLocation || '原站点'} 接到 ${sourceStop.location}`,
      `${sourceStop.location} · ${nextStartTime}${shiftedCount ? ` · 顺延 ${shiftedCount} 项后续活动` : ''}`
    );
    refreshDayTimelineAndRoute(date);
    return true;
  }

  function getRouteSelectionForSegment(index, stopIndices = null) {
    return {
      type: 'segment',
      index,
      segmentIndices: [index],
      stopIndices: Array.isArray(stopIndices) && stopIndices.length ? stopIndices : [index, index + 1]
    };
  }

  function getRouteSelectionForStop(stopIndex, totalStops) {
    const segmentIndices = [];
    if (stopIndex > 0) segmentIndices.push(stopIndex - 1);
    if (stopIndex < totalStops - 1) segmentIndices.push(stopIndex);
    return {
      type: 'stop',
      index: stopIndex,
      segmentIndices,
      stopIndices: [stopIndex]
    };
  }

  function applyRouteSelection(routePanel, selection = null) {
    const segmentSet = new Set(selection?.segmentIndices || []);
    const stopSet = new Set(selection?.stopIndices || []);
    const activeActivitySet = new Set(Array.from(segmentSet).map(index => getRouteSegmentActivityIndex(routePanel, index)).filter(index => index != null));
    routePanel.dataset.activeType = selection?.type || '';
    routePanel.dataset.activeIndex = selection != null ? String(selection.index) : '';
    routePanel.querySelectorAll('.route-segment-card').forEach(card => {
      card.classList.toggle('active', segmentSet.has(Number(card.dataset.segmentIndex)));
    });
    routePanel.querySelectorAll('.route-stop-pill').forEach(pill => {
      pill.classList.toggle('active', stopSet.has(Number(pill.dataset.stopIndex)));
    });
    routePanel.querySelectorAll('.route-timeline-segment').forEach(segment => {
      segment.classList.toggle('active', activeActivitySet.has(Number(segment.dataset.activityIndex)));
    });
  }

  function setActiveRouteSegment(date, activeIndex = null) {
    const routePanel = document.getElementById(`dayRoutePanel-${date}`);
    if (!routePanel) return;
    applyRouteSelection(routePanel, activeIndex == null ? null : getRouteSelectionForSegment(activeIndex));
  }

  function parseRouteStopIndices(value) {
    return String(value || '')
      .split(',')
      .map(item => Number(item))
      .filter(item => !Number.isNaN(item));
  }

  function centerScrollableElement(container, element, behavior = 'smooth') {
    if (!container || !element) return;
    const targetLeft = element.offsetLeft - (container.clientWidth - element.offsetWidth) / 2;
    container.scrollTo({
      left: Math.max(0, targetLeft),
      behavior
    });
  }

  function applyRoutePreview(routePanel, selection = null) {
    const segmentSet = new Set(selection?.segmentIndices || []);
    const stopSet = new Set(selection?.stopIndices || []);
    const previewActivitySet = new Set(Array.from(segmentSet).map(index => getRouteSegmentActivityIndex(routePanel, index)).filter(index => index != null));
    routePanel.querySelectorAll('.route-segment-card').forEach(card => {
      card.classList.toggle('preview', segmentSet.has(Number(card.dataset.segmentIndex)));
    });
    routePanel.querySelectorAll('.route-stop-pill').forEach(pill => {
      pill.classList.toggle('preview', stopSet.has(Number(pill.dataset.stopIndex)));
    });
    routePanel.querySelectorAll('.route-timeline-segment').forEach(segment => {
      segment.classList.toggle('preview', previewActivitySet.has(Number(segment.dataset.activityIndex)));
    });
  }

  function clearRoutePreview(routePanel) {
    applyRoutePreview(routePanel, null);
  }

  function getRouteSegmentActivityIndex(routePanel, segmentIndex) {
    if (!routePanel) return null;
    const card = routePanel.querySelector(`.route-segment-card[data-segment-index="${segmentIndex}"]`);
    const value = card?.dataset?.activityIndex;
    if (value != null && value !== '') {
      const parsed = Number(value);
      if (!Number.isNaN(parsed)) return parsed;
    }
    const stopIndices = parseRouteStopIndices(card?.dataset?.stopIndices || '');
    for (let i = stopIndices.length - 1; i >= 0; i -= 1) {
      const stop = routePanel.querySelector(`.route-stop-pill[data-stop-index="${stopIndices[i]}"]`);
      const stopValue = stop?.dataset?.activityIndex;
      if (stopValue == null || stopValue === '') continue;
      const parsed = Number(stopValue);
      if (!Number.isNaN(parsed)) return parsed;
    }
    return null;
  }

  function getRouteStopActivityIndex(routePanel, stopIndex) {
    if (!routePanel) return null;
    const pill = routePanel.querySelector(`.route-stop-pill[data-stop-index="${stopIndex}"]`);
    const value = pill?.dataset?.activityIndex;
    if (value == null || value === '') return null;
    const parsed = Number(value);
    return Number.isNaN(parsed) ? null : parsed;
  }

  function getRouteSelectionForActivity(routePanel, activityIndex) {
    if (!routePanel || activityIndex == null || activityIndex === '') return null;
    const card = routePanel.querySelector(`.route-segment-card[data-activity-index="${activityIndex}"]`);
    if (!card) return null;
    const segmentIndex = Number(card.dataset.segmentIndex);
    if (Number.isNaN(segmentIndex)) return null;
    return getRouteSelectionForSegment(segmentIndex, parseRouteStopIndices(card.dataset.stopIndices));
  }

  function focusRouteSelection(routePanel, selection, options = {}) {
    if (!routePanel || !selection) return;
    const settings = {
      focusTimeline: true,
      centerSegmentCard: true,
      centerStops: true,
      ...options
    };
    if (settings.centerSegmentCard && selection.type === 'segment') {
      const card = routePanel.querySelector(`.route-segment-card[data-segment-index="${selection.index}"]`);
      centerScrollableElement(routePanel.querySelector('.route-segment-strip'), card);
    }
    if (settings.centerStops && selection.stopIndices?.length) {
      const firstStop = routePanel.querySelector(`.route-stop-pill[data-stop-index="${selection.stopIndices[0]}"]`);
      centerScrollableElement(routePanel.querySelector('.route-stop-strip'), firstStop);
    }
    if (settings.focusTimeline && selection.type === 'segment') {
      const activityIndex = getRouteSegmentActivityIndex(routePanel, selection.index);
      if (activityIndex != null) focusRouteTimelineActivity(routePanel, activityIndex);
    }
  }

  function toggleRouteSegmentSelection(routePanel, segmentIndex, stopIndices = [], options = {}) {
    if (!routePanel) return;
    const isActive = routePanel.dataset.activeType === 'segment' && Number(routePanel.dataset.activeIndex) === segmentIndex;
    const nextSelection = isActive ? null : getRouteSelectionForSegment(segmentIndex, stopIndices);
    applyRouteSelection(routePanel, nextSelection);
    if (!nextSelection) {
      const activityIndex = getRouteSegmentActivityIndex(routePanel, segmentIndex);
      if (activityIndex != null && routePanel.dataset.pinnedActivityIndex === String(activityIndex)) {
        setPinnedRouteActivityHighlight(routePanel, null);
      }
      return;
    }
    focusRouteSelection(routePanel, nextSelection, options);
    const activityIndex = getRouteSegmentActivityIndex(routePanel, segmentIndex);
    if (activityIndex == null) return;
    const sameActivity = routePanel.dataset.pinnedActivityIndex === String(activityIndex);
    const shouldClearPinned = isActive && sameActivity;
    setPinnedRouteActivityHighlight(routePanel, shouldClearPinned ? null : activityIndex);
    if (!shouldClearPinned && options.focusTimeline !== false) {
      focusRouteTimelineActivity(routePanel, activityIndex);
    }
  }

  function applyRouteActivityHighlight(routePanel, activityIndex = null) {
    const hasActive = activityIndex != null && activityIndex !== '';
    const pinnedActivityIndex = routePanel.dataset.pinnedActivityIndex;
    routePanel.dataset.activeActivityIndex = hasActive ? String(activityIndex) : '';
    routePanel.querySelectorAll('.route-segment-card').forEach(card => {
      card.classList.toggle('activity-active', hasActive && card.dataset.activityIndex === String(activityIndex));
      card.classList.toggle('activity-pinned', pinnedActivityIndex !== '' && card.dataset.activityIndex === pinnedActivityIndex);
    });
    routePanel.querySelectorAll('.route-stop-pill').forEach(pill => {
      pill.classList.toggle('activity-active', hasActive && pill.dataset.activityIndex === String(activityIndex));
      pill.classList.toggle('activity-pinned', pinnedActivityIndex !== '' && pill.dataset.activityIndex === pinnedActivityIndex);
    });
    routePanel.querySelectorAll('.route-timeline-segment').forEach(segment => {
      segment.classList.toggle('activity-active', hasActive && segment.dataset.activityIndex === String(activityIndex));
      segment.classList.toggle('activity-pinned', pinnedActivityIndex !== '' && segment.dataset.activityIndex === pinnedActivityIndex);
    });
  }

  function toggleRouteStopSelection(routePanel, stopIndex, totalStops, options = {}) {
    if (!routePanel) return;
    const isActive = routePanel.dataset.activeType === 'stop' && Number(routePanel.dataset.activeIndex) === stopIndex;
    const nextSelection = isActive ? null : getRouteSelectionForStop(stopIndex, totalStops);
    applyRouteSelection(routePanel, nextSelection);
    if (!nextSelection) {
      applyRouteActivityHighlight(routePanel, null);
      return;
    }
    focusRouteSelection(routePanel, nextSelection, options);
    const activityIndex = getRouteStopActivityIndex(routePanel, stopIndex);
    if (activityIndex == null) return;
    applyRouteActivityHighlight(routePanel, activityIndex);
    if (options.focusTimeline !== false) {
      focusRouteTimelineActivity(routePanel, activityIndex);
    }
  }

  function setPinnedRouteActivityHighlight(routePanel, activityIndex = null) {
